<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Inspectra — Profile</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root{
      --accent:#1f7bd1;
      --accent-2:#0ea5e9;
      --bg-start:#f7faff;
      --bg-end:#ecf4fb;
    }
    body{
      font-family:"Montserrat",sans-serif;
      background: linear-gradient(180deg,var(--bg-start),var(--bg-end));
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      min-height:100vh;
      display:flex;
    }
    #sidebar-placeholder { flex-shrink:0; }
    main{
      flex-grow:1;
      max-width:600px;
      margin:auto;
      padding:1.5rem;
    }
    .card{
      background:white;
      border-radius:18px;
      box-shadow:0 10px 30px rgba(20,30,60,0.06);
    }
    input:focus{
      outline:none;
      border-color:var(--accent);
      box-shadow:0 0 0 4px rgba(31,123,209,0.06);
    }
    .btn-gradient{
      background:linear-gradient(90deg,var(--accent),var(--accent-2));
      color:white;
      font-weight:600;
    }
    .btn-danger{
      background:#ef4444;
      color:white;
      font-weight:600;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div id="sidebar-placeholder">{% include "partials/sidebar.html" %}</div>

  <main class="space-y-6 fade-in">
    <div class="text-center">
      <div class="flex items-center justify-center mb-3">
        <i data-lucide="user" class="text-[36px] text-[#1f7bd1]"></i>
      </div>
      <h1 class="text-2xl font-extrabold text-[#0b3b63]">Your Profile</h1>
    </div>

    <form id="profileForm" class="space-y-4">
      
      <!-- FULL NAME FIXED -->
      <div>
        <label class="block text-sm text-gray-700 mb-1">Full Name</label>
        <div class="flex items-center border rounded-md p-2">
          <i data-lucide="user" class="w-4 h-4 text-gray-400 mr-2"></i>
          <input type="text" id="full_name" 
                 value="{{ user.full_name }}">
        </div>
      </div>

      <!-- EMAIL FIXED -->
      <div>
        <label class="block text-sm text-gray-700 mb-1">Email</label>
        <div class="flex items-center border rounded-md p-2">
          <i data-lucide="mail" class="w-4 h-4 text-gray-400 mr-2"></i>
          <input type="email" id="email" 
                 value="{{ user.username }}">
        </div>
      </div>

      <div>
        <label class="block text-sm text-gray-700 mb-1">Role</label>
        <div class="flex items-center border rounded-md p-2 bg-gray-100">
          <i data-lucide="shield" class="w-4 h-4 text-gray-400 mr-2"></i>
          <input type="text" class="w-full" value="{{ user.role }}" disabled>
        </div>
      </div>

      {% if user.role == 'admin' %}
      <div>
        <label class="block text-sm text-gray-700 mb-1">Your Manager Code</label>
        <div class="flex items-center border rounded-md p-2">
          <i data-lucide="key" class="w-4 h-4 text-gray-400 mr-2"></i>
          <input type="text" id="manager_code" class="w-full" value="{{ user.manager_code }}">
        </div>
      </div>
      {% endif %}

      {% if user.role == 'inspector' %}
      <div>
        <label class="block text-sm text-gray-700 mb-1">Assigned Admin Code</label>
        <div class="flex items-center border rounded-md p-2 bg-gray-100">
          <i data-lucide="key" class="w-4 h-4 text-gray-400 mr-2"></i>
          <input type="text" id="manager_code" class="w-full" value="{{ user.manager_code }}" disabled>
        </div>
      </div>
      {% endif %}

      <button type="submit" class="w-full py-2.5 rounded-md btn-gradient flex justify-center items-center gap-2">
        <i data-lucide="save" class="w-5 h-5"></i> Save Changes
      </button>
    </form>

    <div class="card p-4 bg-red-50 border border-red-200 rounded-lg">
      <h3 class="text-red-600 font-bold mb-2">Danger Zone</h3>
      <p class="text-sm text-red-700 mb-3">Deleting your account is permanent and cannot be undone.</p>
      <button class="w-full py-2 rounded-md btn-danger flex justify-center items-center gap-2">
        <i data-lucide="trash" class="w-5 h-5"></i> Delete Account
      </button>
    </div>
  </main>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
