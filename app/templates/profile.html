<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title data-i18n="p.pageTitle">Inspectra — Profile</title>
  {% include "partials/admin_head.html" %}
</head>
<body>
  {% include "partials/sidebar.html" %}

  <main class="page page--narrow">
    <div class="page__head">
      <div>
        <h1 data-i18n="p.title"></h1>
        <p data-i18n="p.sub"></p>
      </div>
    </div>

    <form id="profileForm" class="card" novalidate>
      <h2 data-i18n="p.details"></h2>

      <div class="field">
        <label for="full_name" data-i18n="p.name"></label>
        <div class="input"><i class="fa-regular fa-user" aria-hidden="true"></i>
          <input id="full_name" type="text" autocomplete="name" value="{{ user.full_name or '' }}" required></div>
      </div>

      <div class="field">
        <label for="login_id" data-i18n="p.loginId"></label>
        <div class="input input--locked"><i class="fa-regular fa-id-badge" aria-hidden="true"></i>
          <input id="login_id" type="text" class="ltr" value="{{ user.username }}" readonly></div>
      </div>

      <div class="field">
        <label for="role" data-i18n="p.role"></label>
        <div class="input input--locked"><i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
          <input id="role" type="text" value="" readonly data-role="{{ user.role }}"></div>
      </div>

      <div class="field">
        <label for="manager_code" data-i18n="{{ 'p.codeAdmin' if user.role == 'admin' else 'p.codeInspector' }}"></label>
        <div class="input input--locked"><i class="fa-solid fa-key" aria-hidden="true"></i>
          <input id="manager_code" type="text" class="ltr" value="{{ user.manager_code or '' }}" readonly></div>
        {% if user.role == 'admin' %}<p class="hint" data-i18n="p.codeHint"></p>{% endif %}
      </div>

      <h2 style="margin-top:24px" data-i18n="p.passwordTitle"></h2>
      <div class="field">
        <label for="password" data-i18n="p.newPassword"></label>
        <div class="input"><i class="fa-solid fa-lock" aria-hidden="true"></i>
          <input id="password" type="password" autocomplete="new-password"></div>
        <p class="hint" data-i18n="p.passwordHint"></p>
      </div>
      <div class="field">
        <label for="password2" data-i18n="a.f.confirm"></label>
        <div class="input"><i class="fa-solid fa-lock" aria-hidden="true"></i>
          <input id="password2" type="password" autocomplete="new-password"></div>
      </div>

      <button type="submit" class="btn btn--block" id="saveBtn" data-i18n="p.save"></button>
    </form>
  </main>

  {% include "partials/i18n_scripts.html" %}
  <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
  <script>
  (() => {
    const { t } = window.I18n, { toast, api, errorText } = window.Admin;
    const $ = (id) => document.getElementById(id);
    const roleField = $('role');
    const setRole = () => { roleField.value = t('p.role.' + roleField.dataset.role); };
    setRole();
    document.addEventListener('langchange', setRole);

    $('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = $('full_name').value.trim();
      const password = $('password').value;
      if (!name) { toast(t('p.err.name'), 'error'); $('full_name').focus(); return; }
      if (password && password.length < 6) { toast(t('p.err.short'), 'error'); $('password').focus(); return; }
      if (password !== $('password2').value) { toast(t('a.signup.mismatch'), 'error'); $('password2').focus(); return; }

      const body = { full_name: name };
      if (password) body.password = password;
      $('saveBtn').disabled = true;
      const r = await api('/api/profile', { method: 'POST', body });
      $('saveBtn').disabled = false;
      if (r.ok) {
        $('password').value = $('password2').value = '';
        toast(t('p.saved'), 'ok');
      } else {
        toast(errorText(r), 'error');
      }
    });
  })();
  </script>
</body>
</html>
