<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title data-i18n="e.{{ code }}.title">Inspectra</title>
  <script>try{if(localStorage.getItem("inspectra.theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
  {% include "partials/i18n_head.html" %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-main">
      <main class="auth auth--notice">
        <a class="auth__logo" href="/"><img src="{{ url_for('static', filename='img/inspectra-logo.png') }}" alt="Inspectra" width="132" height="99"></a>
        <div class="auth__lang" data-lang-switcher></div>
        <h1 data-i18n="e.{{ code }}.title"></h1>
        <p class="auth__sub" data-i18n="e.{{ code }}.text"></p>
        <a class="submit submit--link" href="/" data-i18n="e.home"></a>
      </main>
    </div>
  </div>
  {% include "partials/i18n_scripts.html" %}
</body>
</html>
