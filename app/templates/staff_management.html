<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title data-i18n="st.pageTitle">Inspectra — Staff</title>
  {% include "partials/admin_head.html" %}
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
</head>
<body>
  {% include "partials/sidebar.html" %}

  <main class="page">
    <div class="page__head">
      <div>
        <h1 data-i18n="st.title"></h1>
        <p data-i18n="st.sub"></p>
      </div>
      <div class="chips">
        <button type="button" class="btn btn--quiet" id="inviteBtn"><i class="fa-solid fa-share-nodes" aria-hidden="true"></i><span data-i18n="inv.button"></span></button>
        <button type="button" class="btn" id="addInspectorBtn"><i class="fa-solid fa-plus" aria-hidden="true"></i><span data-i18n="st.add"></span></button>
      </div>
    </div>

    <div class="kpis">
      <div class="stat"><div class="stat__icon"><i class="fa-solid fa-users" aria-hidden="true"></i></div>
        <div><div class="stat__value" id="totalInspectors">—</div><div class="stat__label" data-i18n="st.total"></div></div></div>
      <div class="stat"><div class="stat__icon stat__icon--good"><i class="fa-solid fa-receipt" aria-hidden="true"></i></div>
        <div><div class="stat__value" id="avgFines">—</div><div class="stat__label" data-i18n="st.avgFines"></div></div></div>
      <div class="stat"><div class="stat__icon"><i class="fa-solid fa-calendar-check" aria-hidden="true"></i></div>
        <div><div class="stat__value" id="todayTrips">—</div><div class="stat__label" data-i18n="st.today"></div></div></div>
      <div class="stat"><div class="stat__icon stat__icon--warn"><i class="fa-solid fa-user-check" aria-hidden="true"></i></div>
        <div><div class="stat__value" id="activeInspectors">—</div><div class="stat__label" data-i18n="st.active"></div></div></div>
    </div>

    <section class="card">
      <div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h2 style="margin:0" data-i18n="st.overview"></h2>
        <div class="chips" id="filters" role="group" data-i18n-attr="aria-label:st.filter">
          <button type="button" class="chip" data-f="all" aria-pressed="true" data-i18n="st.f.all"></button>
          <button type="button" class="chip" data-f="on" aria-pressed="false" data-i18n="ad.on"></button>
          <button type="button" class="chip" data-f="off" aria-pressed="false" data-i18n="ad.off"></button>
        </div>
        <button type="button" class="btn btn--quiet btn--small" id="exportCsv"><i class="fa-solid fa-file-arrow-down" aria-hidden="true"></i><span data-i18n="c.csv"></span></button>
        <div class="input" style="flex:1;min-width:200px;max-width:340px"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <input id="searchInput" type="search" data-i18n-attr="placeholder:st.search; aria-label:st.search"></div>
      </div>
      <div class="bulkbar" id="bulkBar" hidden>
        <span id="bulkCount"></span>
        <button type="button" class="btn btn--small" data-bulk="online"><i class="fa-solid fa-toggle-on" aria-hidden="true"></i><span data-i18n="bk.online"></span></button>
        <button type="button" class="btn btn--quiet btn--small" data-bulk="offline"><i class="fa-solid fa-toggle-off" aria-hidden="true"></i><span data-i18n="bk.offline"></span></button>
      </div>
      <div class="table-wrap">
        <table id="staffTable" class="table--cards">
          <thead><tr>
            <th class="selcol"><input type="checkbox" id="selAll" data-i18n-attr="aria-label:bk.all"></th>
            <th data-sort="name" tabindex="0" data-i18n="st.th.inspector"></th>
            <th data-sort="available" tabindex="0" data-i18n="st.th.status"></th>
            <th class="num" data-sort="shift_hours_today" tabindex="0" data-i18n="st.th.shift"></th>
            <th class="num" data-sort="today_trips" tabindex="0" data-i18n="st.th.today"></th>
            <th class="num" data-sort="weekly_fines" tabindex="0" data-i18n="st.th.weekly"></th>
            <th data-i18n="st.th.assignment"></th>
            <th><span class="sr-only" data-i18n="st.th.actions"></span></th>
          </tr></thead>
          <tbody id="staffTableBody"></tbody>
        </table>
      </div>
    </section>

    <div class="split split--even" style="margin-top:20px">
      <section class="card" aria-labelledby="tsTitle">
        <h2 id="tsTitle" data-i18n="ts.title"></h2>
        <p class="hint" style="margin:-6px 0 12px" data-i18n="ts.hint"></p>
        <form id="settingsForm" novalidate>
          <div class="formgrid">
            <div class="field"><label for="ts_buffer" data-i18n="ts.buffer"></label><div class="input"><input id="ts_buffer" type="number" min="0" max="30" inputmode="numeric"></div></div>
            <div class="field"><label for="ts_radius" data-i18n="ts.radius"></label><div class="input"><input id="ts_radius" type="number" min="100" max="2000" step="50" inputmode="numeric"></div></div>
            <div class="field"><label for="ts_walk" data-i18n="ts.walk"></label><div class="input"><input id="ts_walk" type="number" min="1" max="20" inputmode="numeric"></div></div>
            <div class="field"><label for="ts_break" data-i18n="ts.break"></label><div class="input"><input id="ts_break" type="number" min="15" max="180" step="5" inputmode="numeric"></div></div>
          </div>
          <p class="hint" data-i18n="ts.breakHint"></p>
          <div class="dialog__actions" style="justify-content:flex-start"><button type="submit" class="btn" data-i18n="ts.save"></button></div>
        </form>
      </section>
      <section class="card" aria-labelledby="auTitle">
        <h2 id="auTitle" data-i18n="au.title"></h2>
        <p class="hint" style="margin:-6px 0 12px" data-i18n="au.hint"></p>
        <ul class="audit" id="auditList"></ul>
      </section>
    </div>

    <section class="card hidden" id="removedCard" style="margin-top:16px">
      <h2 data-i18n="st.removed"></h2>
      <p class="hint" style="margin:-6px 0 12px" data-i18n="st.removedHint"></p>
      <ul class="assign" id="removedList"></ul>
    </section>
  </main>

  {% include "partials/i18n_scripts.html" %}
  <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
  (() => {
    const { t, tm } = window.I18n;
    const { esc, toast, api, errorText, openDialog, closeDialog, confirmDialog } = window.Admin;
    const $ = (id) => document.getElementById(id);
    const TEL_AVIV = [32.0853, 34.7818];
    let staff = [];
    let removed = [];
    let sort = { key: null, asc: true };
    let filter = 'all';
    let shown = [];
    const picked = new Set();
    const ADMIN_CODE = {{ (admin_code or '')|tojson }};
    function downloadCsv(name, rows) {
      const q = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
      const url = URL.createObjectURL(new Blob(['\ufeff' + rows.map((r) => r.map(q).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' }));
      const a = Object.assign(document.createElement('a'), { href: url, download: name });
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    }


    const num = (v) => Number(v ?? 0).toLocaleString(window.I18n.lang);

    async function load() {
      const [r, gone] = await Promise.all([api('/api/staff'), api('/api/staff/deactivated')]);
      if (!r.ok) { toast(errorText(r), 'error'); return; }
      staff = r.data || [];
      removed = gone.ok ? gone.data || [] : [];
      render();
      renderRemoved();
    }

    function renderRemoved() {
      $('removedCard').classList.toggle('hidden', !removed.length);
      $('removedList').innerHTML = removed.map((i) => `<li><span>${esc(i.name)}<small class="ltr">${esc(i.inspector_id)}</small></span>
        <button type="button" class="btn btn--quiet btn--small" data-reactivate="${esc(i.inspector_id)}">${esc(t('st.reactivate'))}</button></li>`).join('');
    }
    $('removedList').addEventListener('click', async (e) => {
      const b = e.target.closest('[data-reactivate]');
      if (!b) return;
      b.disabled = true;
      const r = await api(`/api/inspector/${encodeURIComponent(b.dataset.reactivate)}/reactivate`, { method: 'POST' });
      if (!r.ok) { b.disabled = false; toast(errorText(r), 'error'); return; }
      toast(t('st.reactivated'), 'ok');
      load();
    });

    // ----- bulk actions -----
    function syncBulk() {
      const ids = new Set(staff.map((i) => i.inspector_id));
      [...picked].forEach((x) => { if (!ids.has(x)) picked.delete(x); });
      $('bulkBar').hidden = !picked.size;
      $('bulkCount').textContent = t('bk.selected', { n: picked.size });
      const all = $('selAll');
      all.checked = !!shown.length && shown.every((i) => picked.has(i.inspector_id));
      all.indeterminate = !all.checked && shown.some((i) => picked.has(i.inspector_id));
    }
    $('staffTableBody').addEventListener('change', (e) => {
      const c = e.target.closest('[data-pick]');
      if (!c) return;
      c.checked ? picked.add(c.dataset.pick) : picked.delete(c.dataset.pick);
      syncBulk();
    });
    $('selAll').addEventListener('change', (e) => {
      shown.forEach((i) => (e.target.checked ? picked.add(i.inspector_id) : picked.delete(i.inspector_id)));
      render();
    });
    $('bulkBar').addEventListener('click', async (e) => {
      const b = e.target.closest('[data-bulk]');
      if (!b) return;
      const r = await api('/api/staff/bulk', { method: 'POST', body: { action: b.dataset.bulk, inspector_ids: [...picked] } });
      if (!r.ok) { toast(errorText(r), 'error'); return; }
      toast(t('bk.done', { n: r.data.changed }), 'ok');
      picked.clear();
      load(); loadAudit();
    });

    // ----- team settings + audit log -----
    let audit = [];
    async function loadSettings() {
      const r = await api('/api/team/settings');
      if (!r.ok) return;
      $('ts_buffer').value = r.data.buffer_minutes;
      $('ts_radius').value = r.data.radius_m;
      $('ts_walk').value = r.data.max_walk_minutes;
      $('ts_break').value = r.data.max_break_minutes;
    }
    $('settingsForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const r = await api('/api/team/settings', { method: 'PUT', body: {
        buffer_minutes: Number($('ts_buffer').value), radius_m: Number($('ts_radius').value),
        max_walk_minutes: Number($('ts_walk').value), max_break_minutes: Number($('ts_break').value) } });
      if (!r.ok) { toast(errorText(r), 'error'); return; }
      toast(t('ts.saved'), 'ok');
      loadAudit();
    });
    const ago = (s) => (s < 60 ? t('ad.ago.s', { n: s }) : s < 3600 ? t('ad.ago.m', { n: Math.round(s / 60) }) : s < 86400 ? t('ad.ago.h', { n: Math.round(s / 3600) }) : new Date(Date.now() - s * 1000).toLocaleDateString(window.I18n.lang));
    function renderAudit() {
      $('auditList').innerHTML = audit.length ? audit.map((a) => {
        const key = `au.${a.action}`;
        let text = t(key, { target: a.target || '', detail: a.detail || '' });
        if (text === key) text = a.action;
        return `<li><span><bdi>${esc(text)}</bdi><small>${esc(a.actor || '')}${a.detail && !text.includes(a.detail) ? ` · ${esc(a.detail)}` : ''}</small></span><time>${esc(ago(a.seconds_ago))}</time></li>`;
      }).join('') : `<li style="color:var(--ink-faint)">${esc(t('au.empty'))}</li>`;
    }
    async function loadAudit() {
      const r = await api('/api/audit?limit=20');
      audit = r.ok ? r.data.entries || [] : [];
      renderAudit();
    }

    function stats() {
      const total = staff.length;
      const weekly = staff.reduce((a, i) => a + (i.weekly_fines || 0), 0);
      $('totalInspectors').textContent = num(total);
      $('activeInspectors').textContent = num(staff.filter((i) => i.available).length);
      $('avgFines').textContent = num(Math.round(weekly / (total || 1)));
      $('todayTrips').textContent = num(staff.reduce((a, i) => a + (i.today_trips || 0), 0));
    }

    function render() {
      stats();
      const term = $('searchInput').value.trim().toLowerCase();
      const rows = staff.filter((i) => (filter === 'all' || (filter === 'on') === !!i.available) && `${i.name} ${i.inspector_id}`.toLowerCase().includes(term));
      shown = rows;
      queueMicrotask(syncBulk);
      if (sort.key) {
        rows.sort((a, b) => {
          let x = a[sort.key], y = b[sort.key];
          if (typeof x === 'string') { x = x.toLowerCase(); y = String(y).toLowerCase(); }
          return (x > y ? 1 : x < y ? -1 : 0) * (sort.asc ? 1 : -1);
        });
      }
      document.querySelectorAll('th[data-sort]').forEach((th) => {
        th.setAttribute('aria-sort', th.dataset.sort === sort.key ? (sort.asc ? 'ascending' : 'descending') : 'none');
      });
      const body = $('staffTableBody');
      if (!rows.length) {
        body.innerHTML = `<tr><td colspan="8" class="empty">${esc(t(staff.length ? 'st.noMatch' : 'st.empty'))}</td></tr>`;
        return;
      }
      body.innerHTML = rows.map((i) => {
        const a = i.current_assignment;
        const assignment = a ? `${esc(t('st.run.' + a.status))} · ${num(a.potential_fines)}` : '—';
        const id = esc(i.inspector_id);
        return `<tr>
          <td class="selcol" data-wide><input type="checkbox" data-pick="${id}" ${picked.has(i.inspector_id) ? 'checked' : ''} aria-label="${esc(i.name)}"></td>
          <td data-wide><a href="/staff/${encodeURIComponent(i.inspector_id)}">${esc(i.name)}</a><br><small class="ltr">${id}</small></td>
          <td data-label="${esc(t('st.th.status'))}"><span class="badge badge--${esc(i.state || (i.available ? 'idle' : 'offline'))}">${esc(t('ad.state.' + (i.state || (i.available ? 'idle' : 'offline'))))}</span>${i.break_until ? `<br><small>${esc(t('i.break.until', { time: new Date(i.break_until).toLocaleTimeString(window.I18n.lang, { hour: '2-digit', minute: '2-digit' }) }))}</small>` : ''}</td>
          <td class="num" data-label="${esc(t('st.th.shift'))}">${esc(t('s.hours', { n: num(i.shift_hours_today) }))}</td>
          <td class="num" data-label="${esc(t('st.th.today'))}">${num(i.today_trips)}</td>
          <td class="num" data-label="${esc(t('st.th.weekly'))}">${num(i.weekly_fines)}</td>
          <td data-label="${esc(t('st.th.assignment'))}">${assignment}</td>
          <td data-wide><div class="row-actions">
            <a class="btn btn--quiet btn--small" href="/staff/${encodeURIComponent(i.inspector_id)}">${esc(t('st.profile'))}</a>
            <button type="button" class="btn btn--quiet btn--small" data-act="view" data-id="${id}">${esc(t('st.view'))}</button>
            <button type="button" class="btn btn--quiet btn--small" data-act="edit" data-id="${id}">${esc(t('st.edit'))}</button>
            <button type="button" class="btn btn--quiet btn--small" data-act="reset" data-id="${id}" title="${esc(t('st.reset'))}" aria-label="${esc(t('st.reset'))}"><i class="fa-solid fa-key" aria-hidden="true"></i></button>
            <button type="button" class="btn btn--quiet btn--small" data-act="del" data-id="${id}" aria-label="${esc(t('st.delete'))}"><i class="fa-regular fa-trash-can" aria-hidden="true"></i></button>
          </div></td></tr>`;
      }).join('');
    }

    $('staffTableBody').addEventListener('click', (e) => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      const id = b.dataset.id;
      if (b.dataset.act === 'view') viewLocation(id);
      if (b.dataset.act === 'edit') editInspector(id);
      if (b.dataset.act === 'del') removeInspector(id);
      if (b.dataset.act === 'reset') resetPassword(id);
    });
    document.querySelectorAll('th[data-sort]').forEach((th) => {
      const flip = () => {
        sort = sort.key === th.dataset.sort ? { key: sort.key, asc: !sort.asc } : { key: th.dataset.sort, asc: true };
        render();
      };
      th.addEventListener('click', flip);
      th.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
    });
    $('searchInput').addEventListener('input', render);
    $('filters').addEventListener('click', (e) => {
      const b = e.target.closest('[data-f]');
      if (!b) return;
      filter = b.dataset.f;
      document.querySelectorAll('#filters .chip').forEach((c) => c.setAttribute('aria-pressed', String(c === b)));
      render();
    });
    $('inviteBtn').addEventListener('click', () => (ADMIN_CODE ? window.Admin.inviteDialog(ADMIN_CODE) : toast(tm('no admin code in session'), 'error')));
    $('exportCsv').addEventListener('click', () => downloadCsv('inspectra-staff.csv',
      [['inspector_id', 'name', 'email', 'online', 'trips_today', 'fines_7_days']].concat(
        shown.map((i) => [i.inspector_id, i.name, i.email, i.available ? 'yes' : 'no', i.today_trips, i.weekly_fines]))));

    async function resetPassword(id) {
      const ins = staff.find((i) => i.inspector_id === id);
      const ok = await confirmDialog({ title: t('st.resetTitle', { name: ins ? ins.name : id }), text: t('st.resetText'), okKey: 'st.resetOk', danger: false });
      if (!ok) return;
      const r = await api(`/api/inspector/${encodeURIComponent(id)}/reset_password`, { method: 'POST' });
      if (!r.ok) { toast(errorText(r), 'error'); return; }
      showPassword(r.data, 'st.resetDone');
    }
    document.addEventListener('langchange', () => { render(); renderRemoved(); renderAudit(); });

    // ----- map picker used by the dialogs -----
    function mountMap(el, lat, lon, onPick) {
      const map = L.map(el).setView(lat ? [lat, lon] : TEL_AVIV, lat ? 14 : 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors', maxZoom: 19 }).addTo(map);
      let marker = lat ? L.marker([lat, lon]).addTo(map) : null;
      if (onPick) {
        map.on('click', (e) => { marker?.remove(); marker = L.marker(e.latlng).addTo(map); onPick(e.latlng); });
      }
      setTimeout(() => map.invalidateSize(), 120);
      return { map, setMarker: (p) => { marker?.remove(); marker = L.marker(p).addTo(map); } };
    }

    async function viewLocation(id) {
      const r = await api(`/api/inspector/${encodeURIComponent(id)}`);
      if (!r.ok) { toast(errorText(r), 'error'); return; }
      const ins = r.data;
      const dlg = openDialog(`<h3>${esc(t('st.locTitle'))} — <bdi>${esc(ins.name)}</bdi></h3><div id="dlgMap" class="map"></div>
        <div class="dialog__actions"><button type="button" class="btn btn--quiet" data-close>${esc(t('c.close'))}</button></div>`, { label: ins.name });
      dlg.querySelector('[data-close]').onclick = closeDialog;
      mountMap(dlg.querySelector('#dlgMap'), ins.latitude, ins.longitude);
    }

    function formFields(ins, withId) {
      return `${withId ? `<div class="field"><label for="f_id">${esc(t('st.f.id'))}</label><div class="input"><input id="f_id" class="ltr" autocomplete="off" required></div><p class="hint">${esc(t('st.f.idHint'))}</p></div>` : ''}
        <div class="field"><label for="f_name">${esc(t('st.f.name'))}</label><div class="input"><input id="f_name" value="${esc(ins.name || '')}" required></div></div>
        <div class="field"><label for="f_email">${esc(t('st.f.email'))}</label><div class="input"><input id="f_email" type="email" value="${esc(ins.email || '')}"></div></div>
        <p class="hint" style="margin:0 0 8px">${esc(t('st.f.mapHint'))}</p><div id="dlgMap" class="map"></div>`;
    }

    async function editInspector(id) {
      const r = await api(`/api/inspector/${encodeURIComponent(id)}`);
      if (!r.ok) { toast(errorText(r), 'error'); return; }
      const ins = r.data;
      const dlg = openDialog(`<h3>${esc(t('st.editTitle'))}</h3>${formFields(ins, false)}
        <div class="dialog__actions">
          <button type="button" class="btn btn--quiet" data-close>${esc(t('c.cancel'))}</button>
          <button type="button" class="btn" id="save">${esc(t('c.save'))}</button></div>`, { label: t('st.editTitle') });
      dlg.querySelector('[data-close]').onclick = closeDialog;
      mountMap(dlg.querySelector('#dlgMap'), ins.latitude, ins.longitude, (p) => { ins.latitude = p.lat; ins.longitude = p.lng; });
      dlg.querySelector('#save').onclick = async () => {
        const name = dlg.querySelector('#f_name').value.trim();
        if (!name) { toast(t('st.err.name'), 'error'); return; }
        const res = await api(`/api/inspector/${encodeURIComponent(id)}`, { method: 'PUT', body: {
          name, email: dlg.querySelector('#f_email').value.trim(), latitude: ins.latitude, longitude: ins.longitude } });
        if (!res.ok) { toast(errorText(res), 'error'); return; }
        closeDialog(); toast(t('st.saved'), 'ok'); load();
      };
    }

    $('addInspectorBtn').onclick = () => {
      let picked = null;
      const dlg = openDialog(`<h3>${esc(t('st.addTitle'))}</h3>${formFields({}, true)}
        <div class="dialog__actions">
          <button type="button" class="btn btn--quiet" data-close>${esc(t('c.cancel'))}</button>
          <button type="button" class="btn" id="create">${esc(t('st.create'))}</button></div>`, { label: t('st.addTitle') });
      dlg.querySelector('[data-close]').onclick = closeDialog;
      mountMap(dlg.querySelector('#dlgMap'), null, null, (p) => { picked = p; });
      dlg.querySelector('#create').onclick = async () => {
        const inspector_id = dlg.querySelector('#f_id').value.trim();
        const name = dlg.querySelector('#f_name').value.trim();
        if (!inspector_id || !name) { toast(t('st.err.required'), 'error'); return; }
        const res = await api('/api/inspector', { method: 'POST', body: {
          inspector_id, name, email: dlg.querySelector('#f_email').value.trim(),
          latitude: picked ? picked.lat : null, longitude: picked ? picked.lng : null, available: false } });
        if (!res.ok) { toast(errorText(res), 'error'); return; }
        load();
        showPassword(res.data);
      };
    };

    // The temporary password is only returned once, so the manager has to see it.
    function showPassword(ins, titleKey = 'st.createdTitle') {
      const dlg = openDialog(`<h3>${esc(t(titleKey, { name: ins.name }))}</h3>
        <p>${esc(t('st.createdText'))}</p>
        <p class="hint" style="margin-top:12px">${esc(t('st.createdLogin'))}: <bdi class="ltr">${esc(ins.inspector_id)}</bdi></p>
        <div class="pw"><span id="tmpPw">${esc(ins.temporary_password)}</span>
          <button type="button" class="btn btn--quiet btn--small" id="copyPw">${esc(t('c.copy'))}</button></div>
        <p class="hint" style="margin-top:10px">${esc(t('st.shareHint'))}</p>
        <div class="dialog__actions"><button type="button" class="btn btn--quiet" id="shareLogin">${esc(t('st.copyLogin'))}</button><button type="button" class="btn" data-close>${esc(t('c.done'))}</button></div>`, { label: ins.name });
      dlg.querySelector('#shareLogin').onclick = () => window.Admin.copy(t('st.loginMessage', { id: ins.inspector_id, pw: ins.temporary_password, url: location.origin + '/login' }));
      dlg.querySelector('[data-close]').onclick = closeDialog;
      dlg.querySelector('#copyPw').onclick = async () => {
        try { await navigator.clipboard.writeText(ins.temporary_password); toast(t('c.copied'), 'ok'); }
        catch (e) { toast(ins.temporary_password); }
      };
    }

    async function removeInspector(id) {
      const ins = staff.find((i) => i.inspector_id === id);
      const ok = await confirmDialog({ title: t('st.delTitle', { name: ins ? ins.name : id }), text: t('st.delText') });
      if (!ok) return;
      const r = await api(`/api/inspector/${encodeURIComponent(id)}`, { method: 'DELETE' });
      if (!r.ok) { toast(errorText(r), 'error'); return; }
      toast(t(r.data.deactivated ? 'st.deactivated' : 'st.deleted'), 'ok');
      load();
    }

    load();
    loadSettings();
    loadAudit();
    window.Admin.onLive(() => { load(); loadAudit(); });
    setInterval(() => { if (!document.hidden) load(); }, 30000);
  })();
  </script>
</body>
</html>
