<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title data-i18n="a.login.pageTitle">Inspectra — Login</title>
  {% include "partials/i18n_head.html" %}
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
  <div class="auth-shell">
  {% include "partials/auth_aside.html" %}
  <div class="auth-main">
  <div class="auth__lang" data-lang-switcher></div>
  <main class="auth">
    <div class="auth__top">
      <img class="brand" src="{{ url_for('static', filename='img/inspectra-logo.png') }}" alt="Inspectra" width="132" height="99">
    </div>
    <h1 data-i18n="a.login.title">Welcome back</h1>
    <p class="auth__sub" data-i18n="a.login.sub">Log in to your Inspectra account</p>

    <div class="roles" role="radiogroup" data-i18n-attr="aria-label:a.role.aria">
      <button type="button" role="radio" data-role="inspector" aria-checked="true"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><span data-i18n="a.role.inspector">Inspector</span></button>
      <button type="button" role="radio" data-role="admin" aria-checked="false"><i class="fa-solid fa-shield-halved" aria-hidden="true"></i><span data-i18n="a.role.admin">Admin</span></button>
    </div>

    <form id="loginForm" novalidate>
      <input type="hidden" id="role" value="inspector">
      <div class="field">
        <label for="contact" data-i18n="a.f.contact">Phone, email or manager code</label>
        <div class="input"><i class="fa-regular fa-user" aria-hidden="true"></i>
          <input id="contact" type="text" autocomplete="username" required dir="ltr" placeholder="050-1234567"></div>
      </div>
      <div class="field">
        <label for="password" data-i18n="a.f.password">Password</label>
        <div class="input"><i class="fa-solid fa-lock" aria-hidden="true"></i>
          <input id="password" type="password" autocomplete="current-password" required dir="ltr" placeholder="••••••••">
          <button type="button" id="togglePassword" data-i18n-attr="aria-label:a.f.show"><i class="fa-regular fa-eye" aria-hidden="true"></i></button></div>
      </div>
      <div class="row-end"><button type="button" class="link" id="forgotPassword" data-i18n="a.login.forgot">Forgot password?</button></div>
      <button class="submit" type="submit" data-i18n="a.login.btn">Log in</button>
    </form>
    <p class="switch-line"><span data-i18n="a.login.noAcc">Don't have an account?</span> <a href="/signup" data-i18n="a.login.signup">Sign up</a></p>
  </main>
  </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"><span id="toastMsg"></span></div>
  <div class="bar" aria-hidden="true"><span id="barFill"></span></div>

  {% include "partials/i18n_scripts.html" %}
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
