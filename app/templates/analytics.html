<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title data-i18n="an.pageTitle">Inspectra — Analytics</title>
  {% include "partials/admin_head.html" %}
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  {% include "partials/sidebar.html" %}

  <main class="page">
    <div class="page__head">
      <div>
        <h1 data-i18n="an.title"></h1>
        <p data-i18n="an.sub"></p>
      </div>
      <div class="chips no-print">
        <button type="button" class="btn btn--quiet" id="printBtn"><i class="fa-solid fa-print" aria-hidden="true"></i><span data-i18n="an.print"></span></button>
      </div>
    </div>

    <div class="grid grid--stats">
      <div class="stat"><div class="stat__icon"><i class="fa-solid fa-receipt" aria-hidden="true"></i></div>
        <div><div class="stat__value" id="totalFines">—</div><div class="stat__label" data-i18n="an.totalFines"></div><div class="stat__sub" id="vsPrev"></div></div></div>
      <div class="stat"><div class="stat__icon stat__icon--good"><i class="fa-solid fa-user-check" aria-hidden="true"></i></div>
        <div><div class="stat__value" id="activeInspectors">—</div><div class="stat__label" data-i18n="an.active"></div></div></div>
      <div class="stat"><div class="stat__icon stat__icon--warn"><i class="fa-solid fa-chart-simple" aria-hidden="true"></i></div>
        <div><div class="stat__value" id="peakHour">—</div><div class="stat__label" data-i18n="an.peak"></div></div></div>
    </div>

    <form class="card" id="filters" style="margin-bottom:16px">
      <h2 data-i18n="an.range"></h2>
      <div class="chips no-print" id="presets" role="group" style="margin-bottom:12px">
        <button type="button" class="chip" data-d="0" data-i18n="an.preset.today"></button>
        <button type="button" class="chip" data-d="6" data-i18n="an.preset.7"></button>
        <button type="button" class="chip" data-d="29" data-i18n="an.preset.30"></button>
        <button type="button" class="chip" data-d="month" data-i18n="an.preset.month"></button>
        <button type="button" class="chip" data-d="89" data-i18n="an.preset.quarter"></button>
      </div>
      <div class="filters">
        <div class="field"><label for="startDate" data-i18n="an.from"></label>
          <div class="input"><input id="startDate" type="date" required></div></div>
        <div class="field"><label for="endDate" data-i18n="an.to"></label>
          <div class="input"><input id="endDate" type="date" required></div></div>
        <div class="field"><label for="granularity" data-i18n="an.group"></label>
          <div class="input"><select id="granularity">
            <option value="day" data-i18n="an.g.day"></option>
            <option value="month" data-i18n="an.g.month" selected></option>
            <option value="quarter" data-i18n="an.g.quarter"></option>
            <option value="year" data-i18n="an.g.year"></option>
          </select></div></div>
        <button type="submit" class="btn" id="applyRange" data-i18n="an.apply"></button>
      </div>
    </form>

    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-bottom:16px">
      <section class="card needs-data"><h3 data-i18n="an.byHour"></h3><div class="chart-box"><canvas id="hourlyChart" role="img" data-i18n-attr="aria-label:an.byHour"></canvas></div></section>
      <section class="card needs-data"><h3 data-i18n="an.byDay"></h3><div class="chart-box"><canvas id="dailyChart" role="img" data-i18n-attr="aria-label:an.byDay"></canvas></div></section>
    </div>
    <section class="card" style="margin-bottom:16px">
      <div class="card__head"><h3 data-i18n="an.board"></h3>
        <button type="button" class="btn btn--quiet btn--small" id="exportCsv"><i class="fa-solid fa-file-arrow-down" aria-hidden="true"></i><span data-i18n="c.csv"></span></button></div>
      <ol class="rank" id="board"></ol>
    </section>
    <div class="split needs-data" style="margin-bottom:16px">
      <section class="card" aria-labelledby="hotTitle">
        <h3 id="hotTitle" data-i18n="an.hotspots"></h3>
        <div id="hotMap" class="map" style="height:300px" role="img" data-i18n-attr="aria-label:an.hotspots"></div>
        <p class="hint hidden" id="noPlaces" data-i18n="an.noPlaces"></p>
      </section>
      <section class="card">
        <h3 data-i18n="an.topStops"></h3>
        <ol class="rank" id="topStops"></ol>
        <h3 style="margin-top:20px" data-i18n="an.topLines"></h3>
        <ol class="rank" id="topLines"></ol>
      </section>
    </div>
    <section class="card needs-data" style="margin-bottom:16px">
      <h3 data-i18n="an.people"></h3>
      <div class="table-wrap"><table>
        <thead><tr><th data-i18n="ad.th.inspector"></th><th class="num" data-i18n="an.p.fines"></th><th class="num" data-i18n="an.p.shift"></th><th class="num" data-i18n="an.p.perHour"></th><th class="num" data-i18n="an.p.break"></th><th class="num" data-i18n="an.p.breaks"></th></tr></thead>
        <tbody id="peopleBody"></tbody>
      </table></div>
    </section>
    <section class="card needs-data"><h3 data-i18n="an.timeline"></h3><div class="chart-box"><canvas id="timelineChart" role="img" data-i18n-attr="aria-label:an.timeline"></canvas></div></section>
    <p class="empty hidden" id="noData" data-i18n="an.none"></p>
  </main>

  {% include "partials/i18n_scripts.html" %}
  <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
  (() => {
    const { t } = window.I18n, { esc, toast, api, errorText } = window.Admin;
    const $ = (id) => document.getElementById(id);
    const charts = {};
    let report = null;
    let insights = null;
    let people = [];
    let hot = null;

    const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const today = new Date();
    $('endDate').value = iso(today);
    $('startDate').value = iso(new Date(today.getFullYear(), today.getMonth(), today.getDate() - 89));

    const loc = () => window.I18n.lang;
    const weekdayLabels = () => {
      const f = new Intl.DateTimeFormat(loc(), { weekday: 'short' });
      return Array.from({ length: 7 }, (_, i) => f.format(new Date(2025, 2, 2 + i, 12))); // 2 Mar 2025 is a Sunday
    };
    function periodLabel(key) {
      if (/^\d{4}-Q\d$/.test(key)) { const [y, q] = key.split('-'); return `${q} ${y}`; }
      if (/^\d{4}$/.test(key)) return key;
      const [y, m, d] = key.split('-').map(Number);
      if (d) return new Intl.DateTimeFormat(loc(), { day: 'numeric', month: 'short' }).format(new Date(y, m - 1, d));
      return new Intl.DateTimeFormat(loc(), { month: 'short', year: '2-digit' }).format(new Date(y, m - 1, 1));
    }

    const css = getComputedStyle(document.documentElement);
    const accent = css.getPropertyValue('--accent').trim() || '#1f7bd1';
    const gridColor = () => (document.documentElement.dataset.theme === 'dark' ? 'rgba(255,255,255,.08)' : 'rgba(15,27,45,.06)');
    const baseOptions = () => ({
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false }, ticks: { maxRotation: 0, autoSkipPadding: 12 } },
        y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: gridColor() } },
      },
    });
    function draw(id, type, labels, values, extra = {}) {
      charts[id]?.destroy();
      charts[id] = new Chart($(id), {
        type, options: baseOptions(),
        data: { labels, datasets: [{ label: t('an.totalFines'), data: values, borderColor: accent, backgroundColor: type === 'bar' ? accent : 'rgba(31,123,209,.16)', borderRadius: 6, fill: type === 'line', tension: .3, pointRadius: values.length > 40 ? 0 : 3, ...extra }] },
      });
    }

    function render() {
      if (!report) return;
      Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
      const n = (v) => Number(v).toLocaleString(loc());
      const total = report.totals.fines;
      $('totalFines').textContent = n(total);
      $('activeInspectors').textContent = n(report.totals.activeInspectors);
      const peak = report.hourly.indexOf(Math.max(...report.hourly));
      $('peakHour').textContent = total ? `${String(peak).padStart(2, '0')}:00` : '—';
      $('noData').classList.toggle('hidden', total > 0);
      document.querySelectorAll('.needs-data').forEach((el) => el.classList.toggle('hidden', total === 0));
      const hours = Array.from({ length: 24 }, (_, h) => `${String(h).padStart(2, '0')}:00`);
      draw('hourlyChart', 'line', hours, report.hourly);
      draw('dailyChart', 'bar', weekdayLabels(), report.weekday);
      const top = Math.max(1, ...report.leaderboard.map((r) => r.fines));
      $('board').innerHTML = report.leaderboard.length ? report.leaderboard.map((r, i) =>
        `<li><span class="rank__n">${i + 1}</span><div><b>${esc(r.name)}</b><div class="rank__bar"><span style="width:${Math.round(r.fines / top * 100)}%"></span></div></div><b>${n(r.fines)}</b></li>`).join('')
        : `<li class="empty" style="display:block">${esc(t('ad.empty'))}</li>`;
      draw('timelineChart', 'line', report.timeline.map((r) => periodLabel(r.period)), report.timeline.map((r) => r.fines));
    }

    function renderInsights() {
      const n = (v) => Number(v).toLocaleString(loc());
      const vs = $('vsPrev');
      vs.innerHTML = '';
      if (insights) {
        if (insights.change_percent == null) vs.textContent = t('an.noPrev');
        else {
          const up = insights.change_percent >= 0;
          vs.innerHTML = `<span class="delta delta--${up ? 'up' : 'down'}" dir="ltr">${up ? '▲' : '▼'} ${Math.abs(insights.change_percent)}%</span> ${esc(t('an.vsPrev', { n: n(insights.previous_fines) }))}`;
        }
      }
      const rank = (rows, label) => {
        const top = Math.max(1, ...rows.map((r) => r.fines));
        return rows.length ? rows.map((r, i) => `<li><span class="rank__n">${i + 1}</span><div><b>${label(r)}</b><div class="rank__bar"><span style="width:${Math.round(r.fines / top * 100)}%"></span></div></div><b>${n(r.fines)}</b></li>`).join('')
          : `<li class="empty" style="display:block">${esc(t('an.noPlaces'))}</li>`;
      };
      const stops = (insights?.stops || []).slice(0, 8), lines = insights?.lines || [];
      $('topStops').innerHTML = rank(stops, (r) => `<bdi>${esc(r.name || r.stop_id)}</bdi>`);
      $('topLines').innerHTML = rank(lines, (r) => esc(t('an.line', { line: r.line })));
      drawHot();
    }

    function renderPeople() {
      const n = (v) => Number(v).toLocaleString(loc());
      $('peopleBody').innerHTML = people.length ? people.map((p) => `<tr><td><a href="/staff/${encodeURIComponent(p.inspector_id)}">${esc(p.name)}</a></td><td class="num">${n(p.fines)}</td><td class="num">${esc(t('s.hours', { n: n(p.shift_hours) }))}</td><td class="num">${p.fines_per_hour == null ? '—' : n(p.fines_per_hour)}</td><td class="num">${esc(t('s.hours', { n: n(p.break_hours) }))}</td><td class="num">${n(p.breaks)}</td></tr>`).join('')
        : `<tr><td colspan="6" class="empty">${esc(t('ad.empty'))}</td></tr>`;
    }

    function drawHot() {
      const places = insights?.stops || [];
      $('noPlaces').classList.toggle('hidden', places.length > 0);
      $('hotMap').classList.toggle('hidden', !places.length);
      if (!places.length || !window.L) return;
      if (!hot) {
        hot = { map: L.map('hotMap', { scrollWheelZoom: false }), layer: L.layerGroup() };
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors', maxZoom: 19 }).addTo(hot.map);
        hot.layer.addTo(hot.map);
      }
      hot.layer.clearLayers();
      const top = Math.max(...places.map((p) => p.fines));
      places.forEach((p) => {
        L.circleMarker([p.latitude, p.longitude], { radius: 7 + 20 * (p.fines / top), color: '#b3261e', weight: 2, fillColor: '#b3261e', fillOpacity: .35 })
          .bindTooltip(`${p.name || p.stop_id} · ${t('an.fines', { n: p.fines })}`).addTo(hot.layer);
      });
      hot.map.invalidateSize();
      hot.map.fitBounds(L.latLngBounds(places.map((p) => [p.latitude, p.longitude])), { padding: [30, 30], maxZoom: 15 });
    }

    async function load() {
      const q = new URLSearchParams({ start: $('startDate').value, end: $('endDate').value, granularity: $('granularity').value });
      $('applyRange').disabled = true;
      const range = `start=${$('startDate').value}&end=${$('endDate').value}`;
      const [r, ins, ppl] = await Promise.all([api(`/api/analytics/report?${q}`), api(`/api/analytics/insights?${range}`), api(`/api/analytics/people?${range}`)]);
      $('applyRange').disabled = false;
      if (!r.ok) { toast(errorText(r), 'error'); return; }
      report = r.data;
      insights = ins.ok ? ins.data : null;
      people = ppl.ok ? ppl.data.people || [] : [];
      render();
      renderInsights();
      renderPeople();
    }

    $('presets').addEventListener('click', (e) => {
      const b = e.target.closest('[data-d]');
      if (!b) return;
      const end = new Date();
      const start = b.dataset.d === 'month' ? new Date(end.getFullYear(), end.getMonth(), 1) : new Date(end.getFullYear(), end.getMonth(), end.getDate() - Number(b.dataset.d));
      $('startDate').value = iso(start); $('endDate').value = iso(end);
      $('granularity').value = Number(b.dataset.d) > 40 ? 'month' : 'day';
      load();
    });
    $('exportCsv').addEventListener('click', () => {
      if (!report) return;
      const q = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
      const rows = [['period', 'fines'], ...report.timeline.map((r) => [r.period, r.fines]), [], ['inspector', 'fines'], ...report.leaderboard.map((r) => [r.name, r.fines])];
      const url = URL.createObjectURL(new Blob(['\ufeff' + rows.map((r) => r.map(q).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' }));
      const a = Object.assign(document.createElement('a'), { href: url, download: `inspectra-fines-${report.range.start}_${report.range.end}.csv` });
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    });
    $('filters').addEventListener('submit', (e) => { e.preventDefault(); load(); });
    $('printBtn').addEventListener('click', () => window.print());
    document.addEventListener('langchange', () => { render(); renderInsights(); renderPeople(); });
    load();
  })();
  </script>
</body>
</html>
