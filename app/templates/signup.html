<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title data-i18n="a.signup.pageTitle">Inspectra — Sign up</title>
  {% include "partials/i18n_head.html" %}
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}?v={{ build_id }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
  <div class="auth-shell">
  <div class="auth-main">
  <main class="auth auth--wide">
    <div class="auth__lang" data-lang-switcher></div>
    <a class="auth__logo" href="/" aria-label="Inspectra"><img src="{{ url_for('static', filename='img/inspectra-logo.png') }}" alt="Inspectra" width="132" height="99"></a>
    <h1 data-i18n="a.signup.title">Create your account</h1>
    <p class="auth__sub" data-i18n="a.signup.sub">Join the Inspectra platform</p>

    <div class="roles" role="radiogroup" data-i18n-attr="aria-label:a.role.aria">
      <button type="button" role="radio" data-role="inspector" aria-checked="true"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><span data-i18n="a.role.inspector">Inspector</span></button>
      <button type="button" role="radio" data-role="admin" aria-checked="false"><i class="fa-solid fa-shield-halved" aria-hidden="true"></i><span data-i18n="a.role.admin">Admin</span></button>
    </div>

    <form id="registerForm" novalidate>
      <input type="hidden" id="role" value="inspector">
      <div class="fields-2">
      <div class="field">
        <label for="name" data-i18n="a.f.name">Full name</label>
        <div class="input"><i class="fa-regular fa-user" aria-hidden="true"></i>
          <input id="name" type="text" autocomplete="name" required data-i18n-attr="placeholder:a.f.name.ph"></div>
      </div>
      <div class="field">
        <label for="email" data-i18n="a.f.email">Email</label>
        <div class="input"><i class="fa-regular fa-envelope" aria-hidden="true"></i>
          <input id="email" type="email" autocomplete="email" required dir="ltr" placeholder="name@mail.com"></div>
      </div>
      <div class="field">
        <label for="phone" data-i18n="a.f.phone">Phone number</label>
        <div class="input"><i class="fa-solid fa-phone" aria-hidden="true"></i>
          <input id="phone" type="tel" autocomplete="tel" required dir="ltr" placeholder="05X-XXXXXXX"></div>
      </div>
      <div class="field" id="managerCodeField">
        <label for="managerCode" data-i18n="a.f.manager">Manager code (given by your admin)</label>
        <div class="input"><i class="fa-solid fa-key" aria-hidden="true"></i>
          <input id="managerCode" type="text" dir="ltr" placeholder="ADM001"></div>
      </div>
      <div class="field hidden" id="teamNameField">
        <label for="teamName" data-i18n="a.f.team">Team name</label>
        <div class="input"><i class="fa-solid fa-users" aria-hidden="true"></i>
          <input id="teamName" type="text" data-i18n-attr="placeholder:a.f.team.ph"></div>
      </div>
      </div>
      <div class="fields-2">
      <div class="field">
        <label for="password" data-i18n="a.f.password">Password</label>
        <div class="input"><i class="fa-solid fa-lock" aria-hidden="true"></i>
          <input id="password" type="password" autocomplete="new-password" required dir="ltr">
          <button type="button" id="togglePassword" data-i18n-attr="aria-label:a.f.show"><i class="fa-regular fa-eye" aria-hidden="true"></i></button></div>
        <div class="strength" role="presentation"><span id="strengthFill"></span></div>
        <p class="hint" id="strengthLabel" aria-live="polite"></p>
      </div>
      <div class="field">
        <label for="confirmPassword" data-i18n="a.f.confirm">Confirm password</label>
        <div class="input"><i class="fa-solid fa-lock" aria-hidden="true"></i>
          <input id="confirmPassword" type="password" autocomplete="new-password" required dir="ltr"></div>
      </div>
      </div>
      <button class="submit" type="submit" data-i18n="a.signup.btn">Register</button>
    </form>
    <p class="switch-line"><span data-i18n="a.signup.have">Already registered?</span> <a href="/login" data-i18n="a.signup.login">Log in</a></p>
  </main>
  </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"><span id="toastMsg"></span></div>
  <div class="bar" aria-hidden="true"><span id="barFill"></span></div>

  {% include "partials/i18n_scripts.html" %}
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
