<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title data-i18n="ad.pageTitle">Inspectra — Overview</title>
  {% include "partials/admin_head.html" %}
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
</head>
<body>
  {% include "partials/sidebar.html" %}

  <main class="page">
    <div class="page__head">
      <div>
        <h1 data-i18n="ad.title"></h1>
        <p data-i18n="ad.sub"></p>
      </div>
      <div class="chips">
        <button type="button" class="btn btn--quiet" id="forceAssign"><i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i><span data-i18n="ad.force"></span></button>
        <button type="button" class="btn" id="inviteBtn"><i class="fa-solid fa-user-plus" aria-hidden="true"></i><span data-i18n="inv.button"></span></button>
        <bdi id="adminCodeValue" hidden>{{ session.get('admin_code') or '' }}</bdi>
      </div>
    </div>

    <div class="attention" id="attention" hidden role="status" aria-live="polite"></div>

    <section class="card hidden" id="onboarding" style="margin-bottom:16px">
      <h2 data-i18n="ob.title"></h2>
      <ol class="steps">
        <li><div><b data-i18n="ob.s1"></b><span data-i18n="ob.s1t"></span></div></li>
        <li><div><b data-i18n="ob.s2"></b><span data-i18n="ob.s2t"></span></div></li>
        <li><div><b data-i18n="ob.s3"></b><span data-i18n="ob.s3t"></span></div></li>
      </ol>
      <div class="dialog__actions" style="justify-content:flex-start"><button type="button" class="btn" id="obInvite" data-i18n="inv.button"></button><a class="btn btn--quiet" href="/staff" data-i18n="n.staff"></a></div>
    </section>

    <div class="kpis">
      <div class="stat"><div class="stat__icon stat__icon--good"><i class="fa-solid fa-receipt" aria-hidden="true"></i></div>
        <div><div class="stat__value" id="todayFines">—</div><div class="stat__label" data-i18n="ad.todayFines"></div></div></div>
      <div class="stat"><div class="stat__icon"><i class="fa-solid fa-user-check" aria-hidden="true"></i></div>
        <div><div class="stat__value" id="activeInspectors">—</div><div class="stat__label" data-i18n="ad.onShift"></div></div></div>
      <div class="stat"><div class="stat__icon"><i class="fa-solid fa-route" aria-hidden="true"></i></div>
        <div><div class="stat__value" id="assignedCount">—</div><div class="stat__label" data-i18n="ad.assigned"></div><div class="stat__sub" data-i18n="ad.assignedSub"></div></div></div>
      <div class="stat"><div class="stat__icon stat__icon--warn"><i class="fa-solid fa-bullseye" aria-hidden="true"></i></div>
        <div><div class="stat__value" id="avgEfficiency">—</div><div class="stat__label" data-i18n="ad.efficiency"></div></div></div>
    </div>
    <details class="more">
      <summary data-i18n="ad.moreNumbers"></summary>
      <div class="grid grid--stats">
        <div class="stat"><div class="stat__icon"><i class="fa-solid fa-calendar-week" aria-hidden="true"></i></div>
          <div><div class="stat__value" id="weeklyTotal">—</div><div class="stat__label" data-i18n="ad.weekly"></div></div></div>
        <div class="stat"><div class="stat__icon stat__icon--bad"><i class="fa-solid fa-user-clock" aria-hidden="true"></i></div>
          <div><div class="stat__value" id="unassignedCount">—</div><div class="stat__label" data-i18n="ad.unassigned"></div><div class="stat__sub" data-i18n="ad.unassignedSub"></div></div></div>
        <div class="stat"><div class="stat__icon"><i class="fa-solid fa-stopwatch" aria-hidden="true"></i></div>
          <div><div class="stat__value" id="avgCompletionMin">—</div><div class="stat__label" data-i18n="ad.completion"></div><div class="stat__sub" data-i18n="ad.completionSub"></div></div></div>
      </div>
    </details>

    <div class="ops">
      <section class="card ops__map" aria-labelledby="mapTitle">
        <h2 id="mapTitle" data-i18n="ad.map"></h2>
        <div id="map" class="map"></div>
        <div class="legend">
          <span><i class="s-idle"></i><span data-i18n="ad.state.idle"></span></span>
          <span><i class="s-offered"></i><span data-i18n="ad.state.offered"></span></span>
          <span><i class="s-on_run"></i><span data-i18n="ad.state.on_run"></span></span>
          <span><i class="s-break"></i><span data-i18n="ad.state.break"></span></span>
          <span><i class="s-offline"></i><span data-i18n="ad.state.offline"></span></span>
          <button type="button" class="btn btn--quiet btn--small mapmore" id="mapMore" style="margin-inline-start:auto" data-i18n="ad.mapBig"></button>
          <button type="button" class="btn btn--quiet btn--small" id="fitAll" data-i18n="ad.fit"></button></div>
        <p class="hint" id="updated"></p>
      </section>
      <div class="grid">
        <section class="card" aria-labelledby="tblTitle">
          <h2 id="tblTitle" data-i18n="ad.table"></h2>
          <div class="table-wrap">
            <table>
              <thead><tr>
                <th data-i18n="ad.th.inspector"></th><th data-i18n="ad.th.status"></th>
                <th class="num" data-i18n="ad.th.fines"></th><th class="num" data-i18n="ad.th.trips"></th><th></th>
              </tr></thead>
              <tbody id="inspectorTableBody"></tbody>
            </table>
          </div>
        </section>
        <section class="card">
          <h2 data-i18n="ad.activeRuns"></h2>
          <ul class="assign" id="activeRuns"></ul>
        </section>
        <section class="card" aria-labelledby="actTitle">
          <h2 id="actTitle" data-i18n="ad.act.title"></h2>
          <ul class="feed" id="activityFeed"></ul>
        </section>
      </div>
    </div>
  </main>

  {% include "partials/i18n_scripts.html" %}
  <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
  (() => {
    const { t } = window.I18n, { esc, toast, api, errorText } = window.Admin;
    const $ = (id) => document.getElementById(id);
    const REFRESH_MS = 30000;

    const code = $('adminCodeValue').textContent.trim();
    $('inviteBtn').addEventListener('click', () => window.Admin.inviteDialog(code));
    $('obInvite').addEventListener('click', () => window.Admin.inviteDialog(code));

    const map = L.map('map').setView([32.0853, 34.7818], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors', maxZoom: 19 }).addTo(map);
    const markerLayer = L.layerGroup().addTo(map);
    const linkLayer = L.layerGroup().addTo(map);
    let markers = {};
    let staff = [];
    let fitted = false;
    let updatedAt = null;

    const num = (v, fallback = '0') => (v === null || v === undefined ? fallback : Number(v).toLocaleString(window.I18n.lang));

    const STALE_S = 180;   // a position older than this is drawn faded
    const stateOf = (i) => i.state || (i.available ? 'idle' : 'offline');
    const pin = (state, stale) => L.divIcon({ className: '', html: `<div class="pin pin--${state}${stale ? ' pin--stale' : ''}"></div>`, iconSize: [30, 30], iconAnchor: [15, 30], popupAnchor: [0, -28] });
    const stopIcon = () => L.divIcon({ className: '', html: '<div class="stoppin"><i class="fa-solid fa-bus-simple" aria-hidden="true"></i></div>', iconSize: [24, 24], iconAnchor: [12, 12] });
    const ago = (s) => (s == null ? '' : s < 60 ? t('ad.ago.s', { n: s }) : s < 3600 ? t('ad.ago.m', { n: Math.round(s / 60) }) : t('ad.ago.h', { n: Math.round(s / 3600) }));
    const stateBadge = (state) => `<span class="badge badge--${state}">${esc(t('ad.state.' + state))}</span>`;
    let events = [];
    let points = [];
    const fit = () => { if (points.length) map.fitBounds(points, { padding: [40, 40], maxZoom: 15 }); };
    $('fitAll').addEventListener('click', fit);
    $('mapMore').addEventListener('click', () => {
      const open = $('map').classList.toggle('is-open');
      $('mapMore').textContent = t(open ? 'ad.mapSmall' : 'ad.mapBig');
      setTimeout(() => { map.invalidateSize(); fit(); }, 280);
    });

    // ---- what needs the manager right now ----
    const ATTN_ICON = { offer_unanswered: 'fa-hourglass-half', phone_silent: 'fa-signal', break_overrun: 'fa-mug-hot' };
    const baseTitle = document.title;
    function renderAttention(items) {
      const box = $('attention');
      box.hidden = !items.length;
      document.title = items.length ? `(${items.length}) ${baseTitle}` : baseTitle;
      box.innerHTML = items.slice(0, 5).map((a) => {
        const mins = Math.max(1, Math.round(a.seconds / 60));
        const cancel = a.kind === 'offer_unanswered' ? `<button type="button" class="btn btn--quiet btn--small" data-cancel="${a.run_id}" data-name="${esc(a.name)}">${esc(t('ad.cancelRun'))}</button>` : '';
        return `<div class="attention__item${a.kind === 'offer_unanswered' ? ' attention__item--bad' : ''}"><i class="fa-solid ${ATTN_ICON[a.kind] || 'fa-circle-exclamation'}" aria-hidden="true"></i>
          <span>${esc(t('ad.attn.' + a.kind, { name: a.name, n: mins }))}</span>${cancel}<a class="btn btn--quiet btn--small" href="/staff/${encodeURIComponent(a.inspector_id)}">${esc(t('st.profile'))}</a></div>`;
      }).join('');
    }
    $('attention').addEventListener('click', async (e) => {
      const b = e.target.closest('[data-cancel]');
      if (!b) return;
      const ok = await window.Admin.confirmDialog({ title: t('ad.cancelRunTitle'), text: t('ad.cancelRunText', { name: b.dataset.name }), okKey: 'ad.cancelRun' });
      if (!ok) return;
      const r = await api(`/api/admin/runs/${b.dataset.cancel}/cancel`, { method: 'POST' });
      toast(r.ok ? t('ad.cancelled') : errorText(r), r.ok ? 'ok' : 'error');
      load();
    });

    function renderRuns() {
      const busy = staff.filter((i) => i.current_assignment);
      $('activeRuns').innerHTML = busy.length
        ? busy.map((i) => { const a = i.current_assignment; return `<li><span><a href="/staff/${encodeURIComponent(i.inspector_id)}">${esc(i.name)}</a>
            <small>${esc(a.stop?.name || '')}${a.since_seconds != null ? ` · ${esc(ago(a.since_seconds))}` : ''}</small></span>
            <span class="assign__end"><b>${esc(t('st.run.' + a.status))}</b>
            <button type="button" class="btn btn--quiet btn--small" data-cancel="${a.run_id}" data-name="${esc(i.name)}">${esc(t('ad.cancelRun'))}</button></span></li>`; }).join('')
        : `<li style="justify-content:center;color:var(--ink-faint)">${esc(t('ad.noRuns'))}</li>`;
    }

    function renderFeed() {
      const text = (e) => {
        if (e.kind === 'cancelled') return t(e.was_accepted ? 'ad.act.cancelled' : 'ad.act.declined', { name: e.name });
        return t('ad.act.' + e.kind, { name: e.name, n: e.fines ?? 0 });
      };
      const icon = { offered: 'fa-paper-plane', accepted: 'fa-person-walking', completed: 'fa-circle-check', cancelled: 'fa-ban' };
      $('activityFeed').innerHTML = events.length
        ? events.slice(0, 12).map((e) => `<li class="feed__${e.kind}"><i class="fa-solid ${icon[e.kind] || 'fa-circle'}" aria-hidden="true"></i><span>${esc(text(e))}</span><time>${esc(ago(e.seconds_ago))}</time></li>`).join('')
        : `<li class="feed__empty">${esc(t('ad.act.empty'))}</li>`;
    }

    // ---- manual assignment: pick a live bus for one inspector ----
    async function assignDialog(id) {
      const ins = staff.find((i) => i.inspector_id === id);
      if (!ins) return;
      const dlg = window.Admin.openDialog(`<h3>${esc(t('ad.assign.title', { name: ins.name }))}</h3><p class="hint" style="margin:-6px 0 12px">${esc(t('ad.assign.hint'))}</p>
        <ul class="options" id="optList"><li class="options__state">${esc(t('ad.assign.loading'))}</li></ul>
        <div class="dialog__actions"><button type="button" class="btn btn--quiet" data-close>${esc(t('c.close'))}</button></div>`, { label: t('ad.assign.title', { name: ins.name }) });
      dlg.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) window.Admin.closeDialog(); });
      const r = await api(`/api/admin/options?inspector_id=${encodeURIComponent(id)}`);
      const list = dlg.querySelector('#optList');
      if (!list) return;
      if (!r.ok) { list.innerHTML = `<li class="options__state">${esc(errorText(r))}</li>`; return; }
      const opts = r.data.options || [];
      if (!opts.length) { list.innerHTML = `<li class="options__state">${esc(t('ad.assign.empty'))}</li>`; return; }
      list.innerHTML = opts.map((o, n) => `<li><span class="route-badge">${esc(o.route_num)}</span>
        <span class="options__main"><b>${esc(o.destination || '')}</b><small>${esc(o.stop_name || '')} · ${esc(t('ad.assign.eta', { n: Math.max(1, Math.round(o.minutes_until_arrival)) }))} · ${esc(t('ad.assign.fines', { n: o.potential_fines }))}</small></span>
        <button type="button" class="btn btn--small" data-pick="${n}">${esc(t('ad.assign.send'))}</button></li>`).join('');
      list.addEventListener('click', async (e) => {
        const b = e.target.closest('[data-pick]');
        if (!b) return;
        const o = opts[Number(b.dataset.pick)];
        b.disabled = true;
        const res = await api('/api/admin/assign', { method: 'POST', body: { inspector_id: id, trip_id: o.trip_id, stop_id: o.stop_id, potential_fines: o.potential_fines } });
        if (!res.ok) { b.disabled = false; toast(errorText(res), 'error'); return; }
        window.Admin.closeDialog();
        toast(t('ad.assign.sent', { name: ins.name }), 'ok');
        load();
      });
    }

    $('activeRuns').addEventListener('click', async (e) => {
      const b = e.target.closest('[data-cancel]');
      if (!b) return;
      const ok = await window.Admin.confirmDialog({ title: t('ad.cancelRunTitle'), text: t('ad.cancelRunText', { name: b.dataset.name }), okKey: 'ad.cancelRun' });
      if (!ok) return;
      const r = await api(`/api/admin/runs/${b.dataset.cancel}/cancel`, { method: 'POST' });
      toast(r.ok ? t('ad.cancelled') : errorText(r), r.ok ? 'ok' : 'error');
      load();
    });

    function renderStaff() {
      $('onboarding').classList.toggle('hidden', staff.length > 0);
      renderRuns();
      const body = $('inspectorTableBody');
      markerLayer.clearLayers();
      markers = {};
      linkLayer.clearLayers();
      if (!staff.length) {
        body.innerHTML = `<tr><td colspan="5" class="empty">${esc(t('ad.empty'))}</td></tr>`;
        return;
      }
      body.innerHTML = '';
      points = [];
      const ORDER = { offered: 0, on_run: 1, idle: 2, break: 3, offline: 4 };
      [...staff].sort((a, b) => (ORDER[stateOf(a)] - ORDER[stateOf(b)]) || a.name.localeCompare(b.name)).forEach((i) => {
        const tr = document.createElement('tr');
        tr.className = 'clickable';
        tr.tabIndex = 0;
        const state = stateOf(i), stale = state !== 'offline' && i.last_seen_seconds != null && i.last_seen_seconds > STALE_S;
        tr.innerHTML = `<td><a href="/staff/${encodeURIComponent(i.inspector_id)}">${esc(i.name)}</a><br><small class="ltr">${esc(i.inspector_id)}</small></td>
          <td>${stateBadge(state)}${i.break_until ? `<br><small>${esc(t('i.break.until', { time: new Date(i.break_until).toLocaleTimeString(window.I18n.lang, { hour: '2-digit', minute: '2-digit' }) }))}</small>` : ''}${stale ? `<br><small class="stale">${esc(t('ad.stale'))}</small>` : ''}</td>
          <td class="num">${num(i.total_fines)}</td><td class="num">${num(i.completed_trips)}</td>
          <td>${state === 'idle' ? `<button type="button" class="btn btn--quiet btn--small" data-assign="${esc(i.inspector_id)}">${esc(t('ad.assign.btn'))}</button>` : ''}</td>`;
        tr.querySelector('[data-assign]')?.addEventListener('click', (ev) => { ev.stopPropagation(); assignDialog(i.inspector_id); });
        tr.querySelector('a').addEventListener('click', (ev) => ev.stopPropagation());
        const focus = () => { const m = markers[i.inspector_id]; if (m) { map.setView(m.getLatLng(), 16); m.openPopup(); } };
        tr.addEventListener('click', focus);
        tr.addEventListener('keydown', (e) => { if (e.key === 'Enter') focus(); });
        body.appendChild(tr);
        if (i.latitude && i.longitude) {
          const m = L.marker([i.latitude, i.longitude], { icon: pin(state, stale), title: i.name }).addTo(markerLayer);
          const seen = i.last_seen_seconds == null ? t('ad.seenNever') : t('ad.seen', { ago: ago(i.last_seen_seconds) });
          m.bindPopup(`<b>${esc(i.name)}</b><br>${esc(t('ad.state.' + state))}<br><small>${esc(seen)}</small><br>${esc(t('ad.th.fines'))}: ${num(i.total_fines)} · ${esc(t('ad.th.trips'))}: ${num(i.completed_trips)}`);
          const stop = i.current_assignment?.stop;
          if (stop && stop.latitude != null) {   // a line from the inspector to the stop they are heading to
            L.polyline([[i.latitude, i.longitude], [stop.latitude, stop.longitude]], { color: state === 'offered' ? '#7a4fd1' : '#1b74c4', weight: 3, dashArray: '4 8' }).addTo(linkLayer);
            L.marker([stop.latitude, stop.longitude], { icon: stopIcon(), interactive: false, keyboard: false }).addTo(linkLayer);
          }
          markers[i.inspector_id] = m;
          points.push([i.latitude, i.longitude]);
        }
      });
      if (!fitted && points.length) { fit(); fitted = true; }
    }

    function renderStamp() {
      $('updated').textContent = updatedAt ? t('c.updated', { time: updatedAt.toLocaleTimeString(window.I18n.lang) }) : '';
    }

    async function load() {
      const [stats, list, feed, attn] = await Promise.all([api('/api/analytics'), api('/api/staff'), api('/api/activity?limit=12'), api('/api/attention')]);
      if (attn.ok) renderAttention(attn.data.items || []);
      if (feed.ok) { events = feed.data.events || []; renderFeed(); }
      if (!stats.ok || !list.ok) { toast(errorText(stats.ok ? list : stats), 'error'); return; }
      const d = stats.data;
      $('todayFines').textContent = num(d.totalFines);
      $('weeklyTotal').textContent = num(d.weeklyTotal);
      $('avgEfficiency').textContent = `${num(d.avgEfficiency)}%`;
      $('assignedCount').textContent = num(d.assignedInspectors);
      $('unassignedCount').textContent = num(d.unassignedInspectors);
      $('avgCompletionMin').textContent = num(d.avgCompletionMin, '—');
      staff = list.data || [];
      const working = staff.filter((i) => stateOf(i) !== 'offline').length;
      $('activeInspectors').innerHTML = `<bdi dir="ltr">${num(working)} / ${num(staff.length)}</bdi>`;
      renderStaff();
      updatedAt = new Date();
      renderStamp();
    }

    $('forceAssign').addEventListener('click', async () => {
      const btn = $('forceAssign');
      btn.disabled = true;
      const r = await api('/api/assign_runs', { method: 'POST' });
      btn.disabled = false;
      toast(r.ok ? t('ad.forced') : errorText(r), r.ok ? 'ok' : 'error');
      load();
    });

    document.addEventListener('langchange', () => { renderStaff(); renderFeed(); renderStamp(); });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
    load();
    window.Admin.onLive(load);
    setInterval(() => { if (!document.hidden) load(); }, REFRESH_MS);
  })();
  </script>
</body>
</html>
