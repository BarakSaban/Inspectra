<!-- templates/Analytics.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Inspectra — Analytics</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body{font-family:"Montserrat",sans-serif;background:#f9fafb;margin:0;padding-top:80px;color:#0f172a}
    .container{max-width:1100px;margin:0 auto;padding:28px}
    .card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 6px 18px rgba(15,23,42,0.06)}
  </style>
</head>
<body>
  <div id="sidebar-placeholder"></div>
  <script>fetch("/static/sidebar.html").then(r=>r.text()).then(t=>document.getElementById('sidebar-placeholder').innerHTML=t);</script>

  <main class="container">
    <h1 class="text-3xl font-extrabold text-blue-900 mb-4">Analytics</h1>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
      <div class="card">
        <h3 class="font-semibold mb-2">Total Fines Collected</h3>
        <div id="totalFines" class="text-2xl font-bold">—</div>
      </div>
      <div class="card">
        <h3 class="font-semibold mb-2">Active Inspectors</h3>
        <div id="activeInspectors" class="text-2xl font-bold">—</div>
      </div>
    </div>

    <div class="card mb-4">
      <h3 class="font-semibold mb-2">Hourly fines</h3>
      <canvas id="chart1"></canvas>
    </div>

    <div class="card">
      <h3 class="font-semibold mb-2">Inspector performance</h3>
      <canvas id="chart2"></canvas>
    </div>
  </main>

  <script>
    async function loadAnalytics(){
      const res = await fetch('/api/analytics');
      const data = await res.json();
      document.getElementById('totalFines').innerText = (data.totalFines || 0);
      document.getElementById('activeInspectors').innerText = (data.activeInspectors || 0);

      const labels = (data.hourly || []).map(h => h.hour);
      const values = (data.hourly || []).map(h => h.fines);

      const ctx1 = document.getElementById('chart1').getContext('2d');
      if(window.c1) window.c1.destroy();
      window.c1 = new Chart(ctx1, {
        type: 'line',
        data: { labels, datasets: [{ label: 'Fines', data: values, borderColor:'#1f7bd1', backgroundColor:'rgba(31,123,209,0.12)', fill:true }] },
        options: { plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:true } } }
      });

      // inspector performance chart from inspector list
      const inspectors = data.inspectors || [];
      const labels2 = inspectors.map(i => i.name);
      const values2 = inspectors.map(i => i.total_fines);
      const ctx2 = document.getElementById('chart2').getContext('2d');
      if(window.c2) window.c2.destroy();
      window.c2 = new Chart(ctx2, {
        type: 'bar',
        data: { labels: labels2, datasets: [{ label: 'Total fines', data: values2 }] },
        options: { plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:true } } }
      });
    }

    loadAnalytics();
    setInterval(loadAnalytics, 15000);
  </script>
</body>
</html>
