<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Inspectra — Analytics</title>

  <!-- Google font -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --inspectra-accent: #1f7bd1;
      --inspectra-accent-2: #0ea5e9;
    }

    body {
      font-family: "Montserrat", sans-serif;
      background: linear-gradient(180deg, #f8fbff 0%, #eef6fb 100%);
      color: #0f172a;
      margin: 0;
      padding-top: 80px;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 6px 18px rgba(15,23,42,0.06);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 22px rgba(15,23,42,0.08);
    }

    .gradient-btn {
      background: linear-gradient(90deg, var(--inspectra-accent), var(--inspectra-accent-2));
      color: white;
      font-weight: 600;
      border-radius: 8px;
      padding: 10px 16px;
      transition: opacity 0.2s;
    }
    .gradient-btn:hover {
      opacity: 0.9;
    }

    .stat-card {
      background-color: #ffffff;
      border-radius: 14px;
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 6px 18px rgba(15,23,42,0.06);
    }
    .stat-icon {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      background-color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stat-value {
      font-weight: 700;
      font-size: 1.6rem;
    }
    .stat-label {
      font-size: 0.85rem;
      color: #64748b;
    }
    canvas {
      width: 100% !important;
      height: 260px !important;
    }
  </style>
</head>

<body>
  <!-- Sidebar -->
  <div id="sidebar-placeholder"></div>
  <script>
    fetch("/static/sidebar.html").then(r => r.text()).then(t => document.getElementById('sidebar-placeholder').innerHTML = t);
  </script>

  <main class="max-w-6xl mx-auto px-6 py-6">
    <header class="mb-6">
      <h1 class="text-3xl font-extrabold text-blue-900">Analytics</h1>
      <p class="text-sm text-gray-600">Monitor fines, routes, and inspector performance</p>
    </header>

    <!-- TOP STATS -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 mb-8">
      <div class="stat-card">
        <div class="stat-icon text-blue-600">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M4 4h16v16H4z" /><path d="M4 9h16" />
          </svg>
        </div>
        <div>
          <div class="stat-value" id="totalFines">—</div>
          <div class="stat-label">Total Fines</div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon text-green-600">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M12 8c-4.418 0-8 2.686-8 6s3.582 6 8 6 8-2.686 8-6-3.582-6-8-6z" />
            <path d="M12 2v6" />
          </svg>
        </div>
        <div>
          <div class="stat-value" id="totalMoney">—</div>
          <div class="stat-label">Total Amount (₪)</div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon text-purple-600">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="7" r="4" />
            <path d="M5.5 21a7.5 7.5 0 0 1 13 0" />
          </svg>
        </div>
        <div>
          <div class="stat-value" id="activeInspectors">—</div>
          <div class="stat-label">Active Inspectors</div>
        </div>
      </div>
    </div>

    <!-- FILTERS -->
    <div class="card mb-8">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
        <div>
          <h3 class="font-semibold">Select Time Range</h3>
          <p class="text-sm text-gray-600">Choose dates to filter stats, then click Apply.</p>
        </div>
        <div class="flex flex-wrap items-center gap-3">
          <input id="startDate" type="date" class="border rounded px-2 py-1 focus:ring-2 focus:ring-blue-500">
          <input id="endDate" type="date" class="border rounded px-2 py-1 focus:ring-2 focus:ring-blue-500">
          <select id="granularity" class="border rounded px-2 py-1 focus:ring-2 focus:ring-blue-500">
            <option value="day">Day</option>
            <option value="month" selected>Month</option>
            <option value="quarter">Quarter</option>
            <option value="year">Year</option>
          </select>
          <button id="applyRange" class="gradient-btn">Apply</button>
        </div>
      </div>
    </div>

    <!-- CHARTS -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
      <div class="card">
        <h4 class="font-semibold mb-2 text-gray-700">Fines by Hour of Day</h4>
        <canvas id="hourlyChart"></canvas>
      </div>
      <div class="card">
        <h4 class="font-semibold mb-2 text-gray-700">Fines by Day of Week</h4>
        <canvas id="dailyChart"></canvas>
      </div>
    </div>

    <!-- TIMELINE -->
    <div class="card">
      <h3 class="font-semibold mb-2 text-gray-700">Fines Over Time (Monthly by Quarter)</h3>
      <canvas id="timelineChart"></canvas>
    </div>
  </main>

  <script>
  window.addEventListener("load", async () => {
    let data = {
      totals: { total_fines: 1840, active_inspectors: 17 },
      hourly: [
        { hour: "06:00", fines: 3 }, { hour: "07:00", fines: 7 },
        { hour: "08:00", fines: 12 }, { hour: "09:00", fines: 18 },
        { hour: "10:00", fines: 15 }, { hour: "11:00", fines: 20 },
        { hour: "12:00", fines: 22 }, { hour: "13:00", fines: 19 },
        { hour: "14:00", fines: 17 }, { hour: "15:00", fines: 14 },
        { hour: "16:00", fines: 11 }, { hour: "17:00", fines: 9 },
        { hour: "18:00", fines: 5 }, { hour: "19:00", fines: 2 }
      ],
      daily: [
        { day: "Sun", fines: 70 }, { day: "Mon", fines: 110 },
        { day: "Tue", fines: 90 }, { day: "Wed", fines: 140 },
        { day: "Thu", fines: 130 }, { day: "Fri", fines: 45 },
        { day: "Sat", fines: 25 }
      ],
      timeline: [
        { month: "Jan", fines: 400 }, { month: "Feb", fines: 480 }, { month: "Mar", fines: 530 },
        { month: "Apr", fines: 420 }, { month: "May", fines: 460 }, { month: "Jun", fines: 390 },
        { month: "Jul", fines: 610 }, { month: "Aug", fines: 580 }, { month: "Sep", fines: 560 },
        { month: "Oct", fines: 630 }, { month: "Nov", fines: 590 }, { month: "Dec", fines: 670 }
      ]
    };

    document.getElementById("totalFines").textContent = data.totals.total_fines.toLocaleString();
    document.getElementById("totalMoney").textContent = (data.totals.total_fines * 100).toLocaleString() + " ₪";
    document.getElementById("activeInspectors").textContent = data.totals.active_inspectors;

    const baseOpts = {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { x: { grid: { color: "rgba(0,0,0,0.04)" } }, y: { beginAtZero: true, grid: { color: "rgba(0,0,0,0.04)" } } }
    };

    new Chart(document.getElementById("hourlyChart"), {
      type: "line",
      data: { labels: data.hourly.map(h => h.hour), datasets: [{ data: data.hourly.map(h => h.fines), borderColor: "#1f7bd1", backgroundColor: "rgba(31,123,209,0.25)", fill: true, tension: 0.35 }] },
      options: baseOpts
    });

    new Chart(document.getElementById("dailyChart"), {
      type: "bar",
      data: { labels: data.daily.map(d => d.day), datasets: [{ data: data.daily.map(d => d.fines), backgroundColor: "rgba(14,165,233,0.7)", borderRadius: 6 }] },
      options: baseOpts
    });

    const ctx = document.getElementById("timelineChart").getContext("2d");
    const quarterColors = ["rgba(31,123,209,0.08)","rgba(14,165,233,0.08)","rgba(34,197,94,0.08)","rgba(249,115,22,0.08)"];
    const quarterPlugin = {
      id: "quarterShade",
      beforeDraw: (chart) => {
        const { ctx, chartArea, scales } = chart;
        if (!chartArea) return;
        const { top, bottom, left, right } = chartArea;
        const xScale = scales.x;
        const months = chart.data.labels;
        const quarters = [{ start: 0, end: 2, label: "Q1" },{ start: 3, end: 5, label: "Q2" },{ start: 6, end: 8, label: "Q3" },{ start: 9, end: 11, label: "Q4" }];
        ctx.save();
        quarters.forEach((q, i) => {
          const xStart = xScale.getPixelForTick(q.start);
          const xEnd = q.end + 1 < months.length ? xScale.getPixelForTick(q.end + 1) : right;
          ctx.fillStyle = quarterColors[i];
          ctx.fillRect(xStart, top, xEnd - xStart, bottom - top);
          ctx.fillStyle = "rgba(15,23,42,0.6)";
          ctx.font = "600 12px Montserrat";
          ctx.fillText(q.label, xStart + 10, top + 18);
        });
        ctx.restore();
      }
    };
    new Chart(ctx, {
      type: "line",
      data: { labels: data.timeline.map(t => t.month), datasets: [{ data: data.timeline.map(t => t.fines), borderColor: "#1f7bd1", backgroundColor: "rgba(31,123,209,0.25)", fill: true, tension: 0.35 }] },
      options: baseOpts,
      plugins: [quarterPlugin]
    });
  });
  </script>
</body>
</html>
