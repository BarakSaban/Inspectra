<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Analytics</title>

    <!-- Google font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
      body {
        font-family: "Montserrat", sans-serif;
        background-color: #f9fafb;
        color: #1e293b;
        padding-top: 100px; /* space for fixed topbar */
        margin: 0;
        overflow-x: hidden;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      .page-title {
        text-align: center;
        font-size: 2.3rem;
        font-weight: 800;
        color: #1e3a8a;
        margin-bottom: 40px;
        letter-spacing: -0.02em;
      }

      .grid-cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 20px;
        margin-bottom: 40px;
      }

      .card {
        background: white;
        border-radius: 20px;
        padding: 24px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
        transition: all 0.25s ease;
      }

      .card:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 26px rgba(0, 0, 0, 0.1);
      }

      .card h2 {
        font-size: 1.05rem;
        font-weight: 600;
        color: #475569;
        margin-bottom: 10px;
      }

      .card p {
        font-size: 2rem;
        font-weight: 700;
      }

      .chart-container {
        background: white;
        border-radius: 20px;
        padding: 30px;
        margin-top: 30px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
      }

      #map {
        width: 100%;
        height: 400px;
        border-radius: 20px;
        margin-top: 30px;
      }

      main {
        opacity: 0;
        animation: fadeIn 0.6s ease forwards;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>

  <body>
    <!-- Fixed topbar -->
    <div id="sidebar-placeholder"></div>

    <main>
      <div class="container">
        <h1 class="page-title">Analytics</h1>

        <!-- KPI Cards -->
        <div class="grid-cards">
          <div class="card text-center">
            <h2>Total Inspections</h2>
            <p class="text-blue-600">3,284</p>
          </div>

          <div class="card text-center">
            <h2>Fines Issued</h2>
            <p class="text-rose-500">1,742</p>
          </div>

          <div class="card text-center">
            <h2>Avg. Route Coverage</h2>
            <p class="text-emerald-600">87%</p>
          </div>

          <div class="card text-center">
            <h2>Unpaid Rate</h2>
            <p class="text-yellow-600">12%</p>
          </div>
        </div>

        <!-- Charts -->
        <div class="chart-container">
          <h2 class="font-semibold text-slate-600 mb-3">Weekly Inspections</h2>
          <canvas id="chart1"></canvas>
        </div>

        <div class="chart-container">
          <h2 class="font-semibold text-slate-600 mb-3">Unpaid Rate by Line</h2>
          <canvas id="chart2"></canvas>
        </div>


    <!-- Load topbar -->
    <script>
      fetch("/static/sidebar.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("sidebar-placeholder").innerHTML = data;
        });
    </script>

    <!-- Charts -->
    <script>
      const ctx1 = document.getElementById("chart1");
      const ctx2 = document.getElementById("chart2");

      new Chart(ctx1, {
        type: "line",
        data: {
          labels: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"],
          datasets: [
            {
              label: "Inspections",
              data: [420, 480, 530, 600, 570, 610, 690],
              borderColor: "#2563eb",
              backgroundColor: "rgba(37,99,235,0.2)",
              borderWidth: 3,
              tension: 0.3,
              fill: true,
            },
          ],
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, grid: { color: "#f1f5f9" } },
            x: { grid: { display: false } },
          },
        },
      });

      new Chart(ctx2, {
        type: "bar",
        data: {
          labels: ["Bus 1", "Bus 2", "Bus 3", "Bus 4", "Bus 5"],
          datasets: [
            {
              label: "Unpaid Rate (%)",
              data: [8, 12, 15, 10, 6],
              backgroundColor: [
                "#3b82f6",
                "#10b981",
                "#f59e0b",
                "#ef4444",
                "#6366f1",
              ],
              borderRadius: 10,
            },
          ],
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, grid: { color: "#f1f5f9" } },
            x: { grid: { display: false } },
          },
        },
      });
    </script>

    <!-- Map -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-o9N1jE4yJb7prQm1ZK8D1VmtbMZyR3d0hZf2Z9my0vY="
      crossorigin=""
    ></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-sA+rqDXMf7bZ7wI0T1bM5yQ+v+r8Wq7eT+a1xkPbRr0="
      crossorigin=""
    />

    <script>
      const map = L.map("map").setView([32.0853, 34.7818], 12);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);
      L.marker([32.0853, 34.7818])
        .addTo(map)
        .bindPopup("Tel Aviv HQ")
        .openPopup();
    </script>
  </body>
</html>
