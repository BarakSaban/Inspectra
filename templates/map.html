<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Tel Aviv Bus Stops</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <style>
    #map {
      height: 100vh;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script>
    // Create the map
    var map = L.map('map').setView([32.0853, 34.7818], 12); // Tel Aviv center

    // Add OpenStreetMap base layer
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Load GeoJSON stops data
    fetch('/static/stops.geojson')
      .then(response => response.json())
      .then(data => {
        L.geoJSON(data, {
          onEachFeature: function (feature, layer) {
            if (feature.properties && feature.properties.stop_name) {
              layer.bindPopup(feature.properties.stop_name);
            }
          }
        }).addTo(map);
      });
  </script>
  
  <script>
  fetch('/static/routes.geojson')
    .then(response => response.json())
    .then(data => {
      L.geoJSON(data, {
        style: {
          color: 'red',
          weight: 2,
          opacity: 0.7
        },
        onEachFeature: function (feature, layer) {
          if (feature.properties && feature.properties.route_id) {
            layer.bindPopup('Route ID: ' + feature.properties.route_id + '<br>Trip ID: ' + feature.properties.trip_id);
          }
        }
      }).addTo(map);
    });
</script>
</body>
</html>
