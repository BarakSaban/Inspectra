<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Inspectra — Staff Management</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: "Montserrat", sans-serif;
      background: linear-gradient(180deg, #f8fbff 0%, #eef6fb 100%);
      margin: 0;
      padding-top: 80px;
      color: #0f172a;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 6px 18px rgba(15,23,42,0.06);
    }
    th, td { padding: 8px 12px; text-align: left; }
    thead th {
      font-size: 0.85rem;
      color: #64748b;
      border-bottom: 1px solid #e6edf3;
      cursor: pointer;
      user-select: none;
    }
    .badge-available {
      color: #065f46;
      background: rgba(16,185,129,0.12);
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.8rem;
    }
    .badge-busy {
      color: #b45309;
      background: rgba(245,158,11,0.12);
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.8rem;
    }
    input, select {
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 6px 10px;
    }
    .gradient-btn {
      background: linear-gradient(90deg, #1f7bd1, #0ea5e9);
      color: white;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
    }
  </style>
</head>

<body>
  <div id="sidebar-placeholder"></div>
  <script>
    fetch("/static/sidebar.html")
      .then(r => r.text())
      .then(t => document.getElementById('sidebar-placeholder').innerHTML = t);
  </script>

  <main class="max-w-6xl mx-auto px-6 py-6">
    <header class="mb-6 flex justify-between items-center">
      <div>
        <h1 class="text-3xl font-extrabold text-blue-900">Staff Management</h1>
        <p class="text-sm text-gray-600">Control and understand your inspectors</p>
      </div>
      <div>
        <button id="addInspectorBtn" class="gradient-btn">+ Add Inspector</button>
      </div>
    </header>

    <!-- Date & stats cards -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
      <div class="card">
        <h4 class="font-semibold text-gray-600">Total Inspectors</h4>
        <div id="totalInspectors" class="text-2xl font-bold mt-2">—</div>
      </div>
      <div class="card">
        <h4 class="font-semibold text-gray-600">Avg Fines / 7 days</h4>
        <div id="avgFines" class="text-2xl font-bold mt-2">—</div>
      </div>
      <div class="card">
        <h4 class="font-semibold text-gray-600">Today's Inspections</h4>
        <div id="todayTrips" class="text-2xl font-bold mt-2">—</div>
      </div>
      <div class="card">
        <h4 class="font-semibold text-gray-600">Active Inspectors</h4>
        <div id="activeInspectors" class="text-2xl font-bold mt-2">—</div>
      </div>
    </div>

    <div class="flex flex-col md:flex-row justify-between items-center gap-3 mb-4">
      <input id="searchInput" type="text" placeholder="Search inspector by name..." class="w-full md:w-1/2 border p-2 rounded-lg" />
      <div class="flex items-center gap-2">
        <label class="text-gray-700">From:</label>
        <input type="date" id="fromDate" class="border p-2 rounded-lg" />
        <label class="text-gray-700">To:</label>
        <input type="date" id="toDate" class="border p-2 rounded-lg" />
      </div>
    </div>

    <div class="card">
      <h3 class="font-semibold mb-3">Inspector Overview</h3>
      <table id="staffTable">
        <thead>
          <tr>
            <th data-sort="name">Inspector</th>
            <th data-sort="available">Status</th>
            <th data-sort="today_trips">Today's Trips</th>
            <th data-sort="weekly_fines">Weekly Fines</th>
            <th data-sort="current_assignment">Current Assignment</th>
            <th>View Location</th>
            <th>Edit</th>
            <th>Delete</th>
          </tr>
        </thead>
        <tbody id="staffTableBody"></tbody>
      </table>
    </div>
  </main>

  <div id="modalRoot"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <script>
    let staffData = [];
    let currentSort = { key: null, asc: true };

    async function loadStaff() {
      const res = await fetch('/api/staff');
      staffData = await res.json();
      renderTable();
      updateStats();
    }

    function updateStats() {
      const total = staffData.length;
      const active = staffData.filter(i => i.available).length;
      const avg = staffData.reduce((a, i) => a + (i.weekly_fines || 0), 0) / (total || 1);
      const today = staffData.reduce((a, i) => a + (i.today_trips || 0), 0);
      document.getElementById('totalInspectors').innerText = total;
      document.getElementById('activeInspectors').innerText = active;
      document.getElementById('avgFines').innerText = Math.round(avg);
      document.getElementById('todayTrips').innerText = today;
    }

    function renderTable() {
      const tbody = document.getElementById('staffTableBody');
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      let filtered = staffData.filter(i => i.name.toLowerCase().includes(searchTerm));

      // Sort if applied
      if (currentSort.key) {
        filtered.sort((a, b) => {
          let valA = a[currentSort.key];
          let valB = b[currentSort.key];
          if (typeof valA === "string") valA = valA.toLowerCase();
          if (typeof valB === "string") valB = valB.toLowerCase();
          if (valA > valB) return currentSort.asc ? 1 : -1;
          if (valA < valB) return currentSort.asc ? -1 : 1;
          return 0;
        });
      }

      tbody.innerHTML = '';
      filtered.forEach(i => {
        const assignment = i.current_assignment ? `${i.current_assignment.status} (${i.current_assignment.potential_fines})` : '-';
        tbody.innerHTML += `
          <tr>
            <td>${i.name} (${i.inspector_id})</td>
            <td>${i.available ? '<span class="badge-available">Active</span>' : '<span class="badge-busy">Offline</span>'}</td>
            <td>${i.today_trips}</td>
            <td>${i.weekly_fines}</td>
            <td>${assignment}</td>
            <td><button class="viewLocBtn bg-blue-50 hover:bg-blue-100 text-sm px-2 py-1 rounded" data-id="${i.inspector_id}">View</button></td>
            <td><button class="editBtn bg-gray-100 hover:bg-gray-200 text-sm px-2 py-1 rounded" data-id="${i.inspector_id}">Edit</button></td>
            <td><button class="deleteBtn text-red-600 hover:bg-red-100 text-sm px-2 py-1 rounded" data-id="${i.inspector_id}">✖</button></td>
          </tr>`;
      });

      document.querySelectorAll('.viewLocBtn').forEach(b => b.onclick = e => openViewLocation(e.target.dataset.id));
      document.querySelectorAll('.editBtn').forEach(b => b.onclick = e => openEditInspector(e.target.dataset.id));
      document.querySelectorAll('.deleteBtn').forEach(b => b.onclick = e => deleteInspector(e.target.dataset.id));
    }

    // Double-click sorting on headers
    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll("#staffTable th[data-sort]").forEach(th => {
        th.addEventListener("dblclick", () => {
          const key = th.getAttribute("data-sort");
          if (currentSort.key === key) currentSort.asc = !currentSort.asc;
          else currentSort = { key, asc: true };
          renderTable();
        });
      });
    });

    document.getElementById('searchInput').addEventListener('input', renderTable);

    function showModal(html) {
      const root = document.getElementById('modalRoot');
      root.innerHTML = `
        <div class="fixed inset-0 bg-black bg-opacity-40 flex justify-center items-center z-50" id="modalBackdrop">
          <div class="bg-white p-6 rounded-xl max-w-3xl w-full">
            ${html}
            <div class="mt-4 text-right">
              <button id="closeModal" class="py-2 px-3 rounded bg-gray-100 hover:bg-gray-200">Close</button>
            </div>
          </div>
        </div>`;
      document.getElementById('closeModal').onclick = () => root.innerHTML = '';
      document.getElementById('modalBackdrop').onclick = e => { if (e.target.id === 'modalBackdrop') root.innerHTML = ''; };
    }

    async function openViewLocation(id) {
      const res = await fetch('/api/inspector/' + id);
      if (res.status !== 200) return alert('Inspector not found');
      const ins = await res.json();
      showModal(`<h3 class="text-xl font-bold mb-2">Location — ${ins.name} (${ins.inspector_id})</h3><div id="viewMap" style="height:360px"></div>`);
      setTimeout(() => {
        const map = L.map('viewMap').setView([ins.latitude || 32.0853, ins.longitude || 34.7818], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        if (ins.latitude && ins.longitude)
          L.marker([ins.latitude, ins.longitude]).addTo(map).bindPopup(`<b>${ins.name}</b>`).openPopup();
      }, 100);
    }

    async function openEditInspector(id) {
      const res = await fetch('/api/inspector/' + id);
      if (res.status !== 200) return alert('Inspector not found');
      const ins = await res.json();
      showModal(`
        <h3 class="text-xl font-bold mb-2">Edit — ${ins.name}</h3>
        <div class="grid grid-cols-2 gap-3">
          <div><label>Name</label><input id="edit_name" value="${ins.name}" class="border p-2 rounded w-full"></div>
          <div><label>Email</label><input id="edit_email" value="${ins.email || ''}" class="border p-2 rounded w-full"></div>
          <div><label>Latitude</label><input id="edit_lat" value="${ins.latitude || ''}" class="border p-2 rounded w-full"></div>
          <div><label>Longitude</label><input id="edit_lng" value="${ins.longitude || ''}" class="border p-2 rounded w-full"></div>
          <div class="col-span-2">
            <label>Available</label>
            <select id="edit_available" class="border p-2 rounded w-full">
              <option value="true" ${ins.available ? 'selected' : ''}>Active</option>
              <option value="false" ${!ins.available ? 'selected' : ''}>Offline</option>
            </select>
          </div>
        </div>
        <div class="mt-4 text-right">
          <button id="saveInspector" class="gradient-btn">Save</button>
        </div>`);
      document.getElementById('saveInspector').onclick = async () => {
        const payload = {
          name: document.getElementById('edit_name').value,
          email: document.getElementById('edit_email').value,
          latitude: parseFloat(document.getElementById('edit_lat').value) || null,
          longitude: parseFloat(document.getElementById('edit_lng').value) || null,
          available: document.getElementById('edit_available').value === 'true'
        };
        const putRes = await fetch('/api/inspector/' + id, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
        });
        if (putRes.ok) {
          alert('Updated'); document.getElementById('modalRoot').innerHTML = ''; loadStaff();
        } else alert('Error updating inspector');
      };
    }

    async function deleteInspector(id) {
      if (!confirm("⚠️ Delete this inspector?")) return;
      const res = await fetch('/api/inspector/' + id, { method: 'DELETE' });
      if (res.ok) { alert("Deleted"); loadStaff(); } else alert("Delete failed");
    }

    document.getElementById('addInspectorBtn').onclick = () => {
      showModal(`
        <h3 class="text-xl font-bold mb-2">Add Inspector</h3>
        <div class="grid grid-cols-2 gap-3">
          <div><label>ID</label><input id="new_id" class="border p-2 rounded w-full"></div>
          <div><label>Name</label><input id="new_name" class="border p-2 rounded w-full"></div>
          <div><label>Email</label><input id="new_email" class="border p-2 rounded w-full"></div>
          <div><label>Latitude</label><input id="new_lat" class="border p-2 rounded w-full"></div>
          <div><label>Longitude</label><input id="new_lng" class="border p-2 rounded w-full"></div>
        </div>
        <div class="mt-4 text-right"><button id="createInspector" class="gradient-btn">Create</button></div>`);
      document.getElementById('createInspector').onclick = async () => {
        const payload = {
          inspector_id: document.getElementById('new_id').value,
          name: document.getElementById('new_name').value,
          email: document.getElementById('new_email').value,
          latitude: parseFloat(document.getElementById('new_lat').value) || null,
          longitude: parseFloat(document.getElementById('new_lng').value) || null,
          available: true
        };
        const res = await fetch('/api/inspector', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
        });
        if (res.ok) { alert('Created'); document.getElementById('modalRoot').innerHTML = ''; loadStaff(); }
        else alert('Error creating inspector');
      };
    };

    loadStaff();
    setInterval(loadStaff, 15000);
  </script>
</body>
</html>
