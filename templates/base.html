<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inspectra Admin</title>

  <!-- Common libs -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

  {% block head_extra %}{% endblock %}
</head>
<body class="flex bg-gray-100">
  <!-- Sidebar -->
  <div class="w-64 bg-gray-900 text-white flex flex-col h-screen p-4">
    <h1 class="text-2xl font-bold mb-6">Inspectra</h1>
    <nav class="flex flex-col space-y-2">
      <a href="/admin" class="hover:bg-gray-700 p-2 rounded">Map Dashboard</a>
      <a href="/inspectors" class="hover:bg-gray-700 p-2 rounded">Inspectors</a>
      <a href="/analytics" class="hover:bg-gray-700 p-2 rounded">Analytics</a>
    </nav>
  </div>

  <!-- Main Content -->
  <div class="flex-1 p-6 overflow-y-auto">
    {% block content %}{% endblock %}
  </div>

  {% block scripts %}{% endblock %}
</body>
</html>
