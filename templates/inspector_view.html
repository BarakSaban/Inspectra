<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Inspector Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <!-- AwesomeMarkers CSS -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.awesome-markers/2.0.4/leaflet.awesome-markers.css" />

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* Fullscreen map */
    #map {
      height: 100vh;
      width: 100%;
    }

    /* Floating Action Buttons Container */
    .map-controls {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 1001;
    }

    /* Stylish Buttons */
    .map-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: #1f7bd1;
      color: white;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      padding: 10px 16px;
      box-shadow: 0 4px 12px rgba(31, 123, 209, 0.3);
      cursor: pointer;
      transition: all 0.25s ease;
      font-size: 0.9rem;
    }

    .map-btn i {
      font-size: 1.1rem;
    }

    .map-btn:hover {
      background-color: #0e68c4;
      transform: translateY(-2px);
    }

    .map-btn:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
      transform: none;
    }

    /* Mobile view: move buttons to bottom bar */
    @media (max-width: 768px) {
      .map-controls {
        flex-direction: row;
        justify-content: center;
        align-items: center;
        bottom: 20px;
        top: auto;
        right: 0;
        left: 0;
      }

      .map-btn {
        flex: 1;
        border-radius: 30px;
        padding: 12px 10px;
        font-size: 0.9rem;
      }

      .map-btn i {
        font-size: 1rem;
      }
    }

    /* Slide-up Ride Panel */
    .ride-panel {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: white;
    border-top-left-radius: 20px;
    border-top-right-radius: 20px;
    box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.1);
    padding: 20px 24px;
    z-index: 2000;
    transform: translateY(100%);
    transition: transform 0.35s ease;
    font-family: "Montserrat", system-ui, sans-serif;
    }

    .ride-panel.visible {
    transform: translateY(0);
    }

    .ride-header {
    margin-bottom: 16px;
    }

    .ride-header h3 {
    margin: 0;
    font-size: 1.2rem;
    font-weight: 700;
    color: #0f172a;
    }

    .ride-header p {
    margin: 6px 0 0;
    color: #475569;
    font-size: 0.95rem;
    }

    .ride-btn {
    width: 100%;
    background-color: #1f7bd1;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 12px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
    }

    .ride-btn:hover {
    background-color: #0e68c4;
    }

    .hidden {
    display: none;
    }

  </style>
</head>

<body>
  <!-- Floating Control Buttons -->
  <div class="map-controls">
    <button id="find-nearest-btn" class="map-btn">
      <i class="fas fa-map-marker-alt"></i> Nearest Stop
    </button>
    <button id="find-best-btn" class="map-btn">
      <i class="fas fa-route"></i> Best Trip
    </button>
  </div>

  <!-- Map -->
  <div id="map"></div>

  <!-- Ride Status Panel -->
  <div id="ride-panel" class="ride-panel">
    <div class="ride-header">
      <h3 id="ride-title">No Ride Assigned</h3>
      <p id="ride-description">Press “Get Ride” to receive your next assignment.</p>
    </div>
    <button id="ride-action-btn" class="ride-btn">Get Ride</button>
  </div>


  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.awesome-markers/2.0.4/leaflet.awesome-markers.js"></script>

  <script>
    // ---------------- CONFIG ----------------
    const SEARCH_RADIUS_METERS = 666;
    const BUS_ICON_URL = '/static/bus-stop.png';
    // ---------------- END CONFIG ----------------

    let map, inspectorMarker = null, inspectorCircle = null, userLatLng = null;
    let stops = [], shapes = [], stopShapeMap = [];
    let currentDisplayed = { stopLayer: null, shapeLayer: null, walkLayer: null };

    function initMap() {
      map = L.map('map').setView([32.0853, 34.7818], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);
    }

    async function loadData() {
      const [stopsResp, shapesResp, mappingResp] = await Promise.all([
        fetch('/static/stops.geojson'),
        fetch('/static/shapes.geojson'),
        fetch('/static/stop_shape_map.json')
      ]);
      stops = (await stopsResp.json()).features || [];
      shapes = (await shapesResp.json()).features || [];
      stopShapeMap = await mappingResp.json() || [];
    }

    function createBusIcon() {
      try {
        return L.AwesomeMarkers.icon({
          icon: 'bus',
          prefix: 'fa',
          markerColor: 'blue',
          iconColor: 'white'
        });
      } catch {
        return L.icon({
          iconUrl: BUS_ICON_URL,
          iconSize: [28, 28],
          iconAnchor: [14, 28],
          popupAnchor: [0, -28]
        });
      }
    }

    const busIcon = createBusIcon();
    const inspectorIcon = L.icon({
      iconUrl: 'https://cdn-icons-png.flaticon.com/512/64/64572.png',
      iconSize: [28, 28],
      iconAnchor: [14, 14],
      popupAnchor: [0, -14]
    });

    function startGeolocation() {
      if (!navigator.geolocation) {
        alert('Geolocation not supported.');
        return;
      }

      navigator.geolocation.watchPosition(pos => {
        const lat = 32.0880; // pos.coords.latitude
        const lon = 34.7898; // pos.coords.longitude
        userLatLng = [lat, lon];

        if (!inspectorMarker) {
          inspectorMarker = L.marker(userLatLng, { icon: inspectorIcon }).addTo(map);
          inspectorMarker.bindPopup('You (Inspector)').openPopup();
        } else inspectorMarker.setLatLng(userLatLng);

        if (!inspectorCircle) {
          inspectorCircle = L.circle(userLatLng, { radius: 666, color: '#1f7bd1', fillOpacity: 0.05 }).addTo(map);
        } else inspectorCircle.setLatLng(userLatLng);
      }, err => console.error(err), { enableHighAccuracy: true });
    }

    function clearDisplayed() {
      for (let k of Object.keys(currentDisplayed)) {
        if (currentDisplayed[k]) {
          map.removeLayer(currentDisplayed[k]);
          currentDisplayed[k] = null;
        }
      }
    }

    async function safeJsonFetch(url, options) {
      const resp = await fetch(url, options);
      if (!resp.ok) throw new Error(`Network error ${resp.status}`);
      return resp.json();
    }

    async function fetchNearestAndShow() {
      if (!userLatLng) return alert('Waiting for location...');
      const [lat, lon] = userLatLng;
      try {
        const json = await safeJsonFetch('/api/nearest_stop', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lat, lon, radius: SEARCH_RADIUS_METERS })
        });
        clearDisplayed();
        const stopFeature = json.stop;
        if (!stopFeature?.geometry) return alert('No valid stop returned.');
        const stopMarker = L.geoJSON(stopFeature, {
          pointToLayer: (f, latlng) => L.marker(latlng, { icon: busIcon })
        }).addTo(map).bindPopup(stopFeature.properties?.stop_name || '').openPopup();
        currentDisplayed.stopLayer = stopMarker;
      } catch (err) { alert('Error: ' + err.message); }
    }

    async function fetchBestTripAndShow() {
      if (!userLatLng) return alert('Waiting for location...');
      const btn = document.getElementById('find-best-btn');
      btn.disabled = true; btn.textContent = 'Finding...';
      try {
        const [lat, lon] = userLatLng;
        const json = await safeJsonFetch('/api/find_best_trip', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lat, lon, buffer: 3, radius: 666 })
        });
        clearDisplayed();
        if (json.best_option) {
          if (json.best_option.route_geometry) {
            currentDisplayed.walkLayer = L.geoJSON(json.best_option.route_geometry, {
              style: { color: 'black', weight: 4, dashArray: '8,6' }
            }).addTo(map);
          }
          if (json.stop_feature) {
            currentDisplayed.stopLayer = L.geoJSON(json.stop_feature, {
              pointToLayer: (f, latlng) => L.marker(latlng, { icon: busIcon })
            }).addTo(map).bindPopup(json.stop_feature.properties?.stop_name || '').openPopup();
          }
          if (json.shape_feature) {
            currentDisplayed.shapeLayer = L.geoJSON(json.shape_feature, {
              style: { color: 'green', weight: 4 }
            }).addTo(map);
          }
        } else alert('No reachable trip found.');
      } catch (err) { alert('Error: ' + err.message); }
      finally { btn.disabled = false; btn.textContent = 'Best Trip'; }
    }

    function setupUI() {
      document.getElementById('find-nearest-btn').addEventListener('click', fetchNearestAndShow);
      document.getElementById('find-best-btn').addEventListener('click', fetchBestTripAndShow);
    }

    (async function main() {
      initMap();
      await loadData();
      startGeolocation();
      setupUI();
    })();

    // ------------------- INSPECTOR RIDE FLOW -------------------
    const ridePanel = document.getElementById("ride-panel");
    const rideTitle = document.getElementById("ride-title");
    const rideDesc = document.getElementById("ride-description");
    const rideBtn = document.getElementById("ride-action-btn");

    let rideState = "idle"; // idle -> assigned -> on_route -> in_ride -> completed
    let currentRide = null;

    function showPanel() {
    ridePanel.classList.add("visible");
    }

    function updatePanel() {
    switch (rideState) {
        case "idle":
        rideTitle.textContent = "No Ride Assigned";
        rideDesc.textContent = "Press below to get your next assignment.";
        rideBtn.textContent = "Get Ride";
        break;
        case "assigned":
        rideTitle.textContent = "Ride Assigned!";
        rideDesc.textContent = `Line ${currentRide.line} from ${currentRide.origin} → ${currentRide.destination}`;
        rideBtn.textContent = "Confirm Assignment";
        break;
        case "on_route":
        rideTitle.textContent = "On Your Way";
        rideDesc.textContent = "Confirm once you’re on the vehicle.";
        rideBtn.textContent = "Confirm On Ride";
        break;
        case "in_ride":
        rideTitle.textContent = "Currently Inspecting";
        rideDesc.textContent = "Confirm once you’re done with this ride.";
        rideBtn.textContent = "Confirm Off Ride";
        break;
        case "completed":
        rideTitle.textContent = "Ride Completed 🎉";
        rideDesc.textContent = "Good job! You can now get another ride.";
        rideBtn.textContent = "Get New Ride";
        break;
    }
    }

    // Mock backend calls
    async function fetchRideAssignment() {
    // TODO: Replace with actual API call e.g. /api/assign_ride
    return new Promise(res => {
        setTimeout(() => {
        res({
            id: Math.floor(Math.random() * 10000),
            line: "238",
            origin: "Azrieli Center",
            destination: "Carmel Market",
        });
        }, 1000);
    });
    }

    // Handle button actions
    rideBtn.addEventListener("click", async () => {
    if (rideState === "idle" || rideState === "completed") {
        currentRide = await fetchRideAssignment();
        rideState = "assigned";
        showPanel();
    } else if (rideState === "assigned") {
        rideState = "on_route";
    } else if (rideState === "on_route") {
        rideState = "in_ride";
    } else if (rideState === "in_ride") {
        rideState = "completed";
    }
    updatePanel();
    });

    // Initialize
    showPanel();
    updatePanel();
  </script>
</body>
</html>
