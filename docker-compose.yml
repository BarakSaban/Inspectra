version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    ports:
      - "5000:5000"
    environment:
      # option A: Provide the full URL to either a real DB or the docker-compose.yml db we spin up (favourable option)
      - DATABASE_URL=postgresql+psycopg2://postgres:secretpassword@db:5432/inspectra_db
      
      # option B: Provide individual pieces for full on local db using inspectra.db - should be deprecated soon beezrat hashem
      # - POSTGRES_USER=postgres
      # - POSTGRES_PASSWORD=secretpassword
      # - DATABASE_HOST=db
      # - POSTGRES_DB=inspectra_db
      
      - INSPECTRA_SECRET=dev_secret_123
      - FLASK_DEBUG=True
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secretpassword
      - POSTGRES_DB=inspectra_db
    volumes:
      - inspectra_db_data:/var/lib/postgresql/data

volumes:
  inspectra_db_data: