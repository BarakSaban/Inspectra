apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inspectra-backend-hpa
  namespace: inspectra
  labels:
    app.kubernetes.io/name: inspectra
    app.kubernetes.io/component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inspectra-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50

# Automatically scale backend pods based on CPU usage.
