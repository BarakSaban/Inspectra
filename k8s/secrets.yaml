apiVersion: v1
kind: Secret
metadata:
  name: inspectra-secrets
  namespace: inspectra
  labels:
    app.kubernetes.io/name: inspectra
    app.kubernetes.io/component: secret

type: Opaque
stringData:
  INSPECTRA_SECRET: "replace-with-secure-random-value"
  INSPECTRA_ADMIN_PW: "replace-with-admin-password"
  POSTGRES_USER: "inspectra_user"
  POSTGRES_PASSWORD: "replace-with-db-password"
  POSTGRES_DB: "inspectra"

# Replace placeholders with real secrets. In production, use sealed secrets / vault.
