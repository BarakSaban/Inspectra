apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: inspectra-postgres-pvc
  namespace: inspectra
  labels:
    app.kubernetes.io/name: inspectra
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard

# Persistent volume claim for Postgres data.
# In cloud environments, use an appropriate StorageClass for durability.
