apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: inspectra
  labels:
    app.kubernetes.io/name: inspectra
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app: inspectra-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

# Internal Postgres service for backend database connectivity.
