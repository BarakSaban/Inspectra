apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: inspectra
resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - tls-secret.yaml
  - postgres-pvc.yaml
  - postgres-deployment.yaml
  - postgres-service.yaml
  - redis-deployment.yaml
  - redis-service.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - db-init-job.yaml
  - ingress.yaml
  - backend-hpa.yaml

# Use `kubectl apply -k k8s` to deploy the whole Inspectra stack.
