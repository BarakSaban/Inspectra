apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: inspectra
  labels:
    app.kubernetes.io/name: inspectra
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  selector:
    app: inspectra-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379

# Internal Redis service for optional worker and cache connectivity.
