apiVersion: v1
kind: Service
metadata:
  name: inspectra-backend
  namespace: inspectra
  labels:
    app.kubernetes.io/name: inspectra
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app: inspectra-backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000

# Backend service is internal only; frontend and API clients reach it through the cluster.
