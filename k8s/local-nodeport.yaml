apiVersion: v1
kind: Service
metadata:
  name: inspectra-frontend-nodeport
  namespace: inspectra
  labels:
    app.kubernetes.io/name: inspectra
    app.kubernetes.io/component: frontend
spec:
  type: NodePort
  selector:
    app: inspectra-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080

# Local development fallback if ingress is not available.
# Access the UI on http://<node-ip>:30080.
